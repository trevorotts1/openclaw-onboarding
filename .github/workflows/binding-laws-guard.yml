name: Binding laws guard

# ── SCOPE-LEDGER.md section 4: the 16 BINDING LAWS ────────────────────────────
#
# WHY THIS EXISTS
# SCOPE-LEDGER.md (frozen 2026-11-09) states sixteen laws that apply to every one
# of its thirteen units: 16 x 13 = 208 binding-law applications. Fourteen of the
# sixteen were written ONLY in a prompt. A law stated only in a prompt is verified
# by trusting a transcript, and a transcript is prose -- it can say anything.
#
# ledger-truth-gate.yml already records that exact failure for this repository: an
# unattended cron stamped whole units "verified" after seeing ONE merged leg of a
# two-leg unit, and inflated counts rode those stamps for days. version-consistency
# G4 records another: a tag that LOOKED released while its content was never on
# main. Both were fixed with machinery. This workflow is the same fix for L1-L16.
#
# Two laws already had machinery -- .github/workflows/sf-prover-pin-authority.yml
# refuses a hand-edited pin (L5) and is the single minting path (L6). That pair is
# the model: one authority, no hand edits, verified from the tree rather than
# promised in a report.
#
# WHAT RUNS
#   control  -- runs scripts/test_check_binding_laws.py, which builds throwaway
#               repositories and asserts the checker goes RED on a known-bad tree
#               and GREEN on a known-good one, for every law it can decide from
#               git plus the evidence laws and the DEFERRED rule. A guard that has
#               not been shown to discriminate is decoration. The laws job depends
#               on this one, so a non-discriminating checker cannot pass CI.
#   laws     -- runs scripts/check-binding-laws.py over the PR range.
#
# TWO CLASSES, AND WHY THE SPLIT IS NOT A LOOPHOLE
#   tree     (L1, L5, L6, L12, L13) are decided from the base..head diff, commit
#            authorship, merge topology and ref ancestry. A violation fails here.
#   evidence (L2, L3, L4, L7-L11, L14-L16) constrain what the LANE DID -- force
#            push, SSH, fleet contact, a secret in a transcript, --admin,
#            --no-verify, which model ran QC -- and are not derivable from a tree.
#            They are read from an evidence directory whose VALUES are validated,
#            never merely present. With no directory they are reported DEFERRED,
#            never PASSED, and the summary line counts them separately.
#
#            The `binding-laws:attest` label turns DEFERRED into FAIL, so a lane
#            that wants its completion claim accepted must carry the evidence. A
#            PR without the label is judged on the tree laws only and says so in
#            its own output -- the absence of evidence is visible, never silent.
#
# FAIL-CLOSED: exit 2 from the checker means "the scan could not run", never
# "clean". Only exit 0 passes. A crash, a 127 or a missing script also fails.
#
# Security note: consumes only repo file content and git metadata. The PR title,
# body and commit messages are never interpolated into a run: block, so there is
# no injection surface. The base/head SHAs come from the event but are passed as
# env vars and resolved with `git rev-parse --verify`, which rejects anything that
# is not a commit.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control:
    # Batch pull requests run only the required checks (Trevor order 2026-11-13).
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: Prove the binding-laws guard discriminates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the discrimination self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_check_binding_laws.py

  laws:
    name: Enforce binding laws on the pull request range
    needs: control
    if: ${{ !startsWith(github.head_ref, 'batch/') && (github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: L12 counts merge commits in the range and L13 resolves
          # merge-base --is-ancestor, both of which need real ancestry, not a
          # shallow tip.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce the binding laws
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ATTEST: ${{ contains(github.event.pull_request.labels.*.name, 'binding-laws:attest') }}
        run: |
          set -euo pipefail
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null
          args=(--base "$BASE_SHA" --head "$HEAD_SHA" --json)
          if [ "$ATTEST" = "true" ]; then
            echo "::notice::binding-laws:attest is set -- evidence laws are required, not deferred"
            if [ -d binding-laws-evidence ]; then
              args+=(--evidence-dir binding-laws-evidence)
            else
              echo "::error::label binding-laws:attest is set but binding-laws-evidence/ is not in the tree"
              exit 1
            fi
            args+=(--require-evidence)
          fi
          set +e
          python3 scripts/check-binding-laws.py "${args[@]}"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::binding-laws checker could not run (rc=$rc); that is never a pass"
            exit 2
          fi
          exit "$rc"
