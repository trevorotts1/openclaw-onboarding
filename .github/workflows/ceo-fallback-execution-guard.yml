name: CEO fallback execution guard
on:
  pull_request:
    paths:
      - 'shared-utils/ceo_execution_policy.py'
      - 'shared-utils/sync_ceo_runtime_bindings.py'
      - '23-ai-workforce-blueprint/scripts/build-workforce.py'
      - '23-ai-workforce-blueprint/scripts/create_role_workspaces.py'
      - 'extensions/ceo-routing-doctrine/**'
      - 'scripts/apply-routing-fix.sh'
      - 'scripts/apply-fleet-standards.sh'
      - 'scripts/verify-routing.sh'
      - 'update-skills.sh'
      - '32-command-center-setup/scripts/materialize-dept-agents.sh'
      - '32-command-center-setup/scripts/materialize-dept-agents-roster-shape.test.sh'
      - '23-ai-workforce-blueprint/scripts/test-build-standard-first-roundtrip.sh'
      - 'tests/unit/test_ceo_*.py'
      - '.github/workflows/ceo-fallback-execution-guard.yml'
  push:
    branches: [main]
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify policy, managed upgrades, plugin imports and runtime ownership
        run: |
          python3 tests/unit/test_ceo_execution_policy.py
          python3 tests/unit/test_ceo_runtime_bindings.py
          bash -n scripts/apply-routing-fix.sh scripts/apply-fleet-standards.sh scripts/verify-routing.sh update-skills.sh
      - name: Verify existing workforce repair and both fresh registry formats
        env:
          STANDARD_FIRST_ONBOARDING: '1'
        run: |
          bash 32-command-center-setup/scripts/materialize-dept-agents-roster-shape.test.sh
          bash 32-command-center-setup/scripts/materialize-dept-agents-company-scope.test.sh
          ONB_TEST_REGISTRY=list bash 23-ai-workforce-blueprint/scripts/test-build-standard-first-roundtrip.sh
          ONB_TEST_REGISTRY=entries bash 23-ai-workforce-blueprint/scripts/test-build-standard-first-roundtrip.sh
