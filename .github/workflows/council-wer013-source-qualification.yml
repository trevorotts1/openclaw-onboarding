name: Council WER-013 source qualification

on:
  pull_request:
    paths:
      - "77-council-of-wise-elders/runtime/src/sources/**"
      - "22-book-to-persona-coaching-leadership-system/persona-categories.json"
      - "22-book-to-persona-coaching-leadership-system/personas/**"
      - "77-council-of-wise-elders/runtime/scripts/audit-advisor-sources.ts"
      - "77-council-of-wise-elders/runtime/tests/wer013-primary-coverage.test.ts"
      - "77-council-of-wise-elders/runtime/tests/wer013-skill22-preservation.test.ts"
      - "77-council-of-wise-elders/runtime/scripts/audit-skill22-preservation.ts"
      - "77-council-of-wise-elders/advisors/**"
      - ".github/workflows/council-wer013-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: 77-council-of-wise-elders/runtime/package-lock.json
      - name: Install locked build and audit requirements
        working-directory: 77-council-of-wise-elders/runtime
        run: npm ci --no-audit --no-fund
      - name: Check source coverage classifier and fail-closed cases
        working-directory: 77-council-of-wise-elders/runtime
        run: |
          npm run build
          node --import tsx --test src/sources/sources.test.ts tests/wer013-primary-coverage.test.ts
      - name: Verify Skill 22 legacy books and canonical Council roster are preserved
        working-directory: 77-council-of-wise-elders/runtime
        run: |
          node --import tsx --test tests/wer013-skill22-preservation.test.ts
          node --import tsx scripts/audit-skill22-preservation.ts
          node --import tsx scripts/audit-skill22-preservation.ts --json > "${{ runner.temp }}/council-skill22-preservation.json"
      - name: Print current nine-seat source gap without faking release acceptance
        working-directory: 77-council-of-wise-elders/runtime
        run: |
          node --import tsx scripts/audit-advisor-sources.ts
          node --import tsx scripts/audit-advisor-sources.ts --json > "${{ runner.temp }}/council-source-qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: council-wer013-source-gap-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/council-source-qualification.json
            ${{ runner.temp }}/council-skill22-preservation.json
          retention-days: 14
