name: downsell-wrapper-pins

# DTY-27 (unit U-downsell-ty-01). The D1 wrapper hash-pins three Skill 81 files
# (PIN_VALIDATE_DOWNSELL, PIN_REQUEST_SCHEMA, PIN_EXTENSION_SCHEMA in
# 49-signature-funnel/scripts/downsell_wrapper.py). Before this job no workflow
# ran 49-signature-funnel/scripts/test_downsell_wrapper.py, so a one-byte edit to
# 81-signature-downsell/validators/validate_downsell.py failed only at run time.
# This job runs the suite on every change to either side of the pin. The control
# step first proves the pin test turns red on a one-byte change, so a green here
# is never vacuous. Pin changes also need code-owner review (.github/CODEOWNERS).
# The suite needs pytest and pillow (Skill 71 circle_image, imported by the shared image service). No GitHub event field
# reaches a run: block.

on:
  push:
    branches: [main]
    paths:
      - "49-signature-funnel/scripts/**"
      - "81-signature-downsell/**"
      - "71-blackceo-signature-page/**"
      - ".github/workflows/downsell-wrapper-pins.yml"
      - ".github/CODEOWNERS"
  pull_request:
    branches: [main]
    paths:
      - "49-signature-funnel/scripts/**"
      - "81-signature-downsell/**"
      - "71-blackceo-signature-page/**"
      - ".github/workflows/downsell-wrapper-pins.yml"
      - ".github/CODEOWNERS"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  downsell-wrapper-pins:
    name: downsell-wrapper-pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest and pillow
        run: python -m pip install pytest pillow==10.4.0
      - name: Control - one changed byte of validate_downsell.py must turn the pin test red
        shell: bash
        run: |
          set -uo pipefail
          target=81-signature-downsell/validators/validate_downsell.py
          printf ' ' >> "$target"
          rc=0
          python3 -m pytest 49-signature-funnel/scripts/test_downsell_wrapper.py -q -k DownsellPinTests || rc=$?
          git checkout -- "$target"
          git diff --exit-code -- "$target"
          if [ "$rc" -ne 1 ]; then
            echo "control: expected pytest exit 1 (tests failed) with a tampered validator, got $rc"
            exit 1
          fi
          echo "control: tampered validator turned the pin test red (exit 1)"
      - name: D1 wrapper suite (pins equal sha256 of the Skill 81 files)
        run: python3 -m pytest 49-signature-funnel/scripts/test_downsell_wrapper.py -q
