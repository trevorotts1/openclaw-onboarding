name: fast-guards

# CIO002: one job that runs every fast (< 60 s) guard in turn, instead of ~93
# separate workflows that each paid for their own runner boot + checkout.
# Each guard keeps the exact event / branch / paths filter its old workflow had;
# scripts/ci/fast_guards.py applies that filter against the git diff, prints
# "<guard>: PASS|FAIL|SKIP" per guard, and fails the job if any selected guard
# fails. Guard logic lives unchanged in scripts/ci/fast-guards.d/<guard>.sh;
# the filters live in scripts/ci/fast-guards.json. A change to this workflow or
# to either of those re-runs every guard.
# Deliberately NOT folded: the 8 required checks, the heavy (>= 60 s) workflows,
# macOS jobs, jobs that need a service container, and any workflow whose file is
# read by another guard or test.
# Two shards (guard names sorted, index modulo 2) so the folded guards run in two
# parallel jobs instead of one long one; a guard failure names the guard and the step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-guards:
    # Batch pull requests run only the required checks (Trevor order 2026-11-13).
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: fast-guards (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the folded guards
        # GH_TOKEN: the folded ledger-truth-gate guard clones blackceo-command-center and reads check-runs with it,
        # exactly as its old workflow did with secrets.GITHUB_TOKEN.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/fast_guards.py --shard ${{ matrix.shard }}/2
