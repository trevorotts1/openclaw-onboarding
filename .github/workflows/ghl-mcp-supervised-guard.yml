name: ghl-mcp-supervised-guard

# Fails the build if the GHL MCP autostart scripts regress to an unsupervised /
# random-port configuration — the fleet incident where 12/19 boxes went down
# because a bare `nohup node …` died on teardown and an unpinned PORT bound a
# random port (main.js reads PORT before MCP_SERVER_PORT).
# v12.24.0 / fix/ghl-mcp-supervised-autostart
#
# v21.5.0 (fix/ghl-mcp-installer-hardening): also fails the build if the
# INSTALL-TIME invariants regress — an unpinned/floating third-party checkout,
# a missing GHL_TOOL_PROFILE (the 858-tool default), an unconditional KeepAlive
# (bad-token relaunch loop), a dist/ deleted before a successful build, a
# missing liveness probe, or a re-registered Tier 2 MCP. The 2026-08-02/03
# outage was NOT a supervision failure: every box stayed supervised, listening
# and "healthy" while answering nothing for two days.
#
# v21.6.0 (fix/ghl-mcp-pin-delivery-and-runtime-assert): three additions, each
# closing a hole v21.5.0's own CI could not see, because every v21.5.0 check ran
# in the REPO layout — the one layout where the bug was invisible.
#   R1  the pin file must actually REACH a box. A new cross-reference gate
#       asserts every resolver path is a path an installer populates, and a new
#       unit test proves the box layout (not the repo layout) resolves it.
#   R4  a RUNTIME conformance gate that reads the INSTALLED service, with a
#       mutation test proving it fails a misconfigured service and passes a
#       correct one.
#   R9  fail-closed refusal on an unverified/unvetted pin, proven in both
#       directions so the refusal cannot brick a correctly-vetted box.

# ─────────────────────────────────────────────────────────────────────────────
# THE `paths:` FILTERS ARE GONE ON PURPOSE (fix/ghl-mcp-mirror-and-vetting-gate)
#
# A path-filtered workflow can NEVER be used as a required status check: on any
# pull request that does not touch the filtered paths the check is never
# reported, and the PR sits at "Expected — Waiting for status to be reported"
# forever. That is the failure mode that gets a gate switched off, so if the
# pin gate is ever to become enforcement rather than notification, the filter
# cannot be here.
#
# The filter list was also unsound for this gate specifically. The pin gate
# compares the pin file against the built-in fallback constants in the launch
# scripts AND against a live mirror; a push that touched none of the listed
# files could still break that relationship. And the list is hand-maintained,
# so a NEW consumer of the pin is silently uncovered until somebody remembers.
#
# Both jobs are cheap — bash syntax checks, static assertions, shell unit tests
# and one shallow fetch. Do not reintroduce the filters.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# TREVOR-DECISION — THIS JOB IS LOUD, NOT BLOCKING. HERE IS WHAT WOULD CHANGE THAT.
# ─────────────────────────────────────────────────────────────────────────────
# `main` on this repo has enforce_admins and blocks force-push and deletion, but
# it has NO required status checks, NO required reviews and NO rulesets. Merges
# are direct pushes of locally-created merge commits, and CI runs AFTER the push.
# A red run therefore paints a red X on a commit that is already on `main`.
# Nothing in this file, or in any of the other guard workflows, can currently
# stop anything. That is a true statement about every gate in this repository.
#
# It is NOT changed here, deliberately: turning it on changes how Trevor merges,
# and that is his call, not a side effect of a fix. To make it enforcement:
#
#   gh api -X POST repos/trevorotts1/openclaw-onboarding/rulesets \
#     -f name='pin-gate' -f target='branch' -f enforcement='active' \
#     -F 'conditions[ref_name][include][]=refs/heads/main' \
#     -F 'rules[][type]=required_status_checks' \
#     -F 'rules[][parameters][required_status_checks][][context]=ghl-mcp-pin-gate'
#
# PROS: a bad pin cannot reach `main` at all; the gate stops being advisory; the
#   merge-train discipline already in use is largely compatible with it.
# CONS: it forces a PULL REQUEST for every merge to `main` — a required status
#   check cannot be satisfied by a direct push. Serialized merge trains become
#   PR-per-item. Emergency fixes need an admin bypass or a bypass actor.
#   And the check must ALWAYS run, or PRs hang forever at "Expected — Waiting for
#   status to be reported" (which is why the `paths:` filters above are gone —
#   do not put them back if this is ever enabled).
#
# UNTIL THEN the enforcement that actually protects a client machine is not here.
# It is the box-side refusal in the installer, which runs on paths CI never sees
# (probe --heal, manual remediation, a partial roll) and long after any CI run.
# CI protects the repo; the installer protects the machine. This job's job is to
# be impossible to miss.
#
# ─────────────────────────────────────────────────────────────────────────────
# DESIGN NOTE (not implemented — deliberate follow-on): CI-built, ATTESTED artifact
# ─────────────────────────────────────────────────────────────────────────────
# The digest proves "this is the commit we reviewed". It cannot prove "the bytes
# that ran are the bytes that commit builds to", because every client box still
# runs `npm` against a third-party dependency tree and compiles it locally.
#
# The complete answer is to stop building on client boxes at all: a workflow IN
# THE MIRROR builds `dist/` from the pinned commit on a pinned Node version,
# signs the tarball with `actions/attest-build-provenance` (SLSA v1.0 Build
# Level 2 by default; Level 3 via a reusable workflow), and publishes it as a
# release. Boxes fetch and verify with
#   gh attestation verify <file> --repo trevorotts1/ghl-community-mcp-mirror
# falling back to a pinned sha256 from the pin file where `gh` is absent.
#
# That removes third-party lifecycle-script execution from every client machine
# and makes a build-time crash structurally impossible, because no box builds.
# It is NOT done here because it is a day of work, it depends on the mirror
# (which only just exists), and it is moot if the local server is retired in
# favour of the vendor's official remote MCP. Sequence it after that ruling.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
  pull_request:

jobs:
  ghl-mcp-pin-gate:
    # NOTE: this job name is the string Trevor would enter if he ever decides to
    # make it a required status check. Renaming the job silently un-requires it.
    name: ghl-mcp-pin-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the date-advance check needs the previous pin file

      - name: Syntax-check the pin gate, the policy layer and the vetting tool
        run: |
          for f in \
            scripts/qc-assert-ghl-mcp-pin-gate.sh \
            scripts/ghl-mcp-check-pin-digest.sh \
            scripts/ghl-mcp-vet-pin.sh \
            scripts/ghl-mcp-pin-digest.sh; do
            bash -n "$f"
          done
          python3 -m py_compile scripts/qc-assert-ghl-mcp-pin-resolvers.py

      - name: Determine the base commit to diff the pin against
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            # A brand-new branch reports an all-zero "before"; there is nothing
            # to compare against and that is not a failure.
            case "$PUSH_BEFORE" in
              ''|0000000000000000000000000000000000000000) BASE="" ;;
              *) BASE="$PUSH_BEFORE" ;;
            esac
          fi
          if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "base commit $BASE is not in this checkout — skipping the date-advance check"
            BASE=""
          fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

      # THE GATE. The same script the pre-push hook and a human run, so the
      # three can never disagree about what "this pin is OK" means. --network is
      # what makes it more than a spell-check: it proves the pinned commit is
      # actually fetchable BY SHA from the mirror (a fresh box can provision)
      # and that the dependency lockfile the verdict covers is the one that
      # would be installed.
      - name: GHL MCP pin gate (digest binding, mirror reachability, lockfile, fallbacks)
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: |
          chmod +x scripts/qc-assert-ghl-mcp-pin-gate.sh
          if [ -n "$BASE_REF" ]; then
            bash scripts/qc-assert-ghl-mcp-pin-gate.sh --network --base-ref "$BASE_REF"
          else
            bash scripts/qc-assert-ghl-mcp-pin-gate.sh --network
          fi

      # The mutation proofs. A gate whose failure path is untested is a gate
      # nobody has ever seen fail, which is indistinguishable from one that
      # cannot fail. GHL_MCP_PIN_TEST_NETWORK=1 also exercises the mirror-backed
      # review path of the vetting tool.
      - name: Vetting-digest mutation proofs (hand-edited verdict, swapped SHA, swapped mirror, missing digest, …)
        env:
          GHL_MCP_PIN_TEST_NETWORK: '1'
        run: |
          chmod +x tests/unit/ghl-mcp-pin-digest.test.sh
          bash tests/unit/ghl-mcp-pin-digest.test.sh

  ghl-mcp-supervised-guard:
    name: GHL MCP supervision + install regression guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check the autostart + probe + gate scripts
        run: |
          for f in \
            scripts/ghl-mcp-autostart.sh \
            scripts/ghl-mcp-probe.sh \
            scripts/ghl-mcp-pin-digest.sh \
            scripts/ghl-mcp-assert-runtime.sh \
            scripts/qc-assert-ghl-mcp-supervised.sh \
            scripts/qc-assert-pin-delivery-paths.sh \
            scripts/qc-assert-mcp-unset-verb.sh \
            platform/vps/36-ghl-mcp-setup-scripts/start-ghl-mcp-server.sh \
            install.sh \
            update-skills.sh; do
            bash -n "$f"
          done

      - name: Pin must be a full 40-char vetted commit (never a branch or short SHA)
        run: |
          grep -qE '^GHL_MCP_VETTED_COMMIT="[0-9a-f]{40}"' config/ghl-mcp-pin.env

      # v21.6.0 / R9. The verdict used to be sourced by three scripts and read
      # by none of them, by the QC gate, or by CI — it was INERT, not advisory.
      # This is the transitional CI half: it enforces the CLEAN verdict and,
      # once scripts/ghl-mcp-vet-pin.sh populates GHL_MCP_PIN_VETTED_DIGEST,
      # automatically upgrades to enforcing that the digest recomputes. No CI
      # edit is needed when the digest lands.
      - name: Vetting verdict must be CLEAN, and the digest (once present) must recompute
        run: |
          chmod +x scripts/ghl-mcp-pin-digest.sh
          grep -qE '^GHL_MCP_PIN_VETTED_VERDICT="CLEAN"' config/ghl-mcp-pin.env \
            || { echo "::error::config/ghl-mcp-pin.env verdict is not CLEAN — an unvetted pin must never ship."; exit 1; }
          set +e
          bash scripts/ghl-mcp-pin-digest.sh verify config/ghl-mcp-pin.env
          rc=$?
          set -e
          case "$rc" in
            0) echo "vetting digest MATCHES (self-invalidating vetting is fully armed)" ;;
            3) echo "::notice::no GHL_MCP_PIN_VETTED_DIGEST yet — transitional CLEAN-verdict mode. FOLLOW-UP: scripts/ghl-mcp-vet-pin.sh must populate GHL_MCP_DEPS_LOCK_SHA256 + GHL_MCP_PIN_VETTED_DIGEST." ;;
            *) echo "::error::the vetting digest does not recompute — the pin was edited without re-running scripts/ghl-mcp-vet-pin.sh."; exit 1 ;;
          esac

      # v21.6.0 / R1. THE check whose absence made v21.5.0 a repo-only release:
      # 17 resolver candidates across four consumers, zero delivery steps.
      - name: Every pin-file resolver path must be a path an installer delivers
        run: |
          chmod +x scripts/qc-assert-pin-delivery-paths.sh
          bash scripts/qc-assert-pin-delivery-paths.sh

      - name: Run GHL MCP supervision + install invariant gate (must pass)
        run: |
          chmod +x scripts/qc-assert-ghl-mcp-supervised.sh
          bash scripts/qc-assert-ghl-mcp-supervised.sh

      - name: Run GHL MCP supervision unit test (positive + negative)
        run: |
          chmod +x tests/unit/ghl-mcp-supervised.test.sh
          bash tests/unit/ghl-mcp-supervised.test.sh

      - name: Run GHL MCP liveness-probe unit test (detects alive-but-deaf)
        run: |
          chmod +x tests/unit/ghl-mcp-probe.test.sh
          bash tests/unit/ghl-mcp-probe.test.sh

      # D6 (P0 security). This one is a MUTATION PROOF, not a lint: it boots a real
      # node server that calls listen(port,'0.0.0.0') with and without the generated
      # guard and asserts the OBSERVED bind address changes. Upstream hardcodes the
      # 0.0.0.0 bind in both entry points, so a check that merely greps for
      # "127.0.0.1" would go green on a fix that does nothing.
      - name: Run GHL MCP loopback bind-guard unit test (proves the bind actually moves)
        run: |
          chmod +x tests/unit/ghl-mcp-bind-guard.test.sh
          bash tests/unit/ghl-mcp-bind-guard.test.sh
      # v21.7.4 / B2. `openclaw mcp remove` IS NOT A COMMAND on OpenClaw
      # 2026.7.1-2 — it exits 1 with "Too many arguments for this command."
      # The correct call is `openclaw mcp unset <name>`. The repo carried 8
      # occurrences of the wrong verb and 0 of the right one, every executable
      # site swallowed by `|| true`, so Tier 2 was never de-registered on any
      # box and runtime check 10 could never pass anywhere.
      - name: No MCP de-registration may use 'mcp remove' alone (the verb is 'unset')
        run: |
          chmod +x scripts/qc-assert-mcp-unset-verb.sh
          bash scripts/qc-assert-mcp-unset-verb.sh

      # v21.7.3 / DEFECT 3. Check 13 used to degrade to INFO when lsof was
      # absent (every slim container), conflating "the port is free" with "I
      # cannot tell" — and it masked a real 0.0.0.0 exposure confirmed via
      # /proc/net/tcp. This binds REAL sockets, so the verdicts are proven, not
      # fixture-matched.
      - name: Run GHL MCP bind-determination test (undeterminable is FATAL, never INFO)
        run: |
          chmod +x tests/unit/ghl-mcp-bind-determination.test.sh
          bash tests/unit/ghl-mcp-bind-determination.test.sh

      # v21.7.2 / B1 (P0). The installer used to overwrite the server .env's
      # GHL_LOCATION_ID with no backup and no validation. Proven live: same
      # token, on-disk location -> HTTP 200, installer-written location -> HTTP
      # 403; main.js testConnection()s at boot and exit(1)s, so the server went
      # down and stayed down, and the working file had to come back from a Time
      # Machine snapshot. This is a MUTATION PROOF driven through the REAL
      # function with a stub curl — a grep for the word "backup" would go green
      # on a fix that still clobbers.
      - name: Run GHL MCP .env credential-clobber guard test (working pairing must survive)
        run: |
          chmod +x tests/unit/ghl-mcp-env-credential-guard.test.sh
          bash tests/unit/ghl-mcp-env-credential-guard.test.sh

      # v21.6.0 / R1 + R9. Runs against a SIMULATED BOX LAYOUT, never the repo
      # layout — the repo layout is where the delivery bug was invisible.
      - name: Run pin-delivery + fail-closed unit test (BOX layout, not repo layout)
        run: |
          chmod +x tests/unit/ghl-mcp-pin-delivery.test.sh
          bash tests/unit/ghl-mcp-pin-delivery.test.sh

      # v21.6.0 / R4. Mutation proof in BOTH directions: a correct installed
      # service must PASS and each single misconfiguration must FAIL. A gate
      # that only ever passes is what shipped in v21.5.0.
      - name: Run runtime-conformance mutation test (correct service passes, each defect fails)
        run: |
          chmod +x tests/unit/ghl-mcp-assert-runtime.test.sh
          bash tests/unit/ghl-mcp-assert-runtime.test.sh

      # The runtime gate must report SKIP (rc=2), never FAIL, in a checkout that
      # has no installed service — otherwise wiring it into qc-system-integrity
      # would turn every CI run and every non-Tier-2 box red.
      - name: Runtime gate must SKIP cleanly where Tier 2 is not installed
        run: |
          chmod +x scripts/ghl-mcp-assert-runtime.sh
          set +e
          bash scripts/ghl-mcp-assert-runtime.sh --quiet
          rc=$?
          set -e
          [ "$rc" = "2" ] || { echo "::error::runtime gate returned $rc in a bare checkout; expected 2 (nothing to assert)."; exit 1; }
