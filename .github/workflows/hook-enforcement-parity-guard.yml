name: hook-enforcement parity guard
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hook-enforcement-parity:
    # Batch pull requests run only the required checks (Trevor order 2026-11-13).
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: hook-enforcement parity guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hook enforcement parity guard
        run: bash scripts/guard-hook-enforcement-parity.sh
