name: KIE prompt enforcer guard (rule 12)

# Owner order 2026-10-05 (KIE prompt rule 12): every KIE descriptive prompt is 95 to 100 percent of the
# model maxLength, hard floor 80 percent, hard ceiling 100 percent, enforced by ONE shared Python enforcer
# (shared-utils/kie_prompt_enforcer.py, which wraps Skill 74 prompt-budget --check). This job fails when the
# enforcer regresses, a declared gate module stops importing it, or a separate hard-coded band returns.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "shared-utils/kie_prompt_enforcer.py"
      - "shared-utils/kie_prompt_gates.json"
      - "shared-utils/social_prompt_compiler.py"
      - "shared-utils/social_prompt_policy.json"
      - "74-kie-live-adapter/scripts/kie_live_adapter.py"
      - "tests/unit/kie-prompt-enforcer-and-gates.test.py"
      - "scripts/qc_gip_agnes_prompt_band.py"
      - "25-video-creator/scripts/ai_providers.py"
      - "35-social-media-planner/scripts/pregen_prompt_gate.py"
      - "45-design-intelligence-library/scripts/**"
      - "66-kie-image/scripts/validate_prompt.py"
      - "67-kie-video/scripts/validate_prompt.py"
      - "68-kie-audio/scripts/validate_audio_request.py"
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/build_deck.py"
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/prompt_gate.py"
      - ".github/workflows/kie-prompt-enforcer-guard.yml"

jobs:
  kie-prompt-enforcer-guard:
    name: KIE prompt enforcer guard (one enforcer, no separate band)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforcer behavior + declared gates import it and keep no band
        run: python3 tests/unit/kie-prompt-enforcer-and-gates.test.py
      - name: Every gate self-test passes rule 12 (79 percent rejected, 95 and 100 percent pass, 101 percent rejected)
        run: |
          export HOME="$(mktemp -d)"
          python3 scripts/qc_gip_agnes_prompt_band.py --self-test
          python3 66-kie-image/scripts/validate_prompt.py --self-test
          python3 67-kie-video/scripts/validate_prompt.py --self-test
          python3 68-kie-audio/scripts/validate_audio_request.py --self-test
          python3 shared-utils/social_prompt_compiler.py --self-test
          python3 35-social-media-planner/scripts/test_pregen_prompt_gate.py
          python3 45-design-intelligence-library/scripts/prove_gip_prompt_floor.py --self-test
          python3 45-design-intelligence-library/scripts/test_prompt_band_cli.py
          python3 23-ai-workforce-blueprint/templates/role-library/presentations/scripts/prove_pres_prompt_floor.py --self-test
