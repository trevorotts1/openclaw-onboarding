name: launch-family-seams

# Harmony-95 M3: one workflow that runs the cross-skill seam tests of the
# signature launch family (Skills 44, 49, 50, 71, 78-83 and the shared
# signature_launch trees) on every pull request that touches them.
#
# Fail-closed by design:
#   * every test named below must EXIST; a missing file is a red check, never a
#     silent skip (the "required files present" step);
#   * every test runs in a clean environment (env -i, throwaway HOME), one
#     process at a time (well under the four-process ceiling);
#   * all steps run even after a failure (if: always()) so one red test does not
#     hide another.
# Some seam tests are red on a branch until the contract changes they guard have
# landed (Harmony-95 batch P). That is intended: a red check here is the signal.
# verify.sh additions named in M3 (78, 79, 80, 81, 82, 49, 50) are owned by the
# work packages that create the tests they discover: 79/80/81/82 by wp16, 49 by
# wp15, 50 by wp06b. This file adds none, so the branches cannot collide; this
# workflow runs the same suites directly, so CI coverage does not wait on them.
# Pillow is pinned (same pin as downsell-wrapper-pins.yml) because 78's tests
# reach circle_image.py through 71 and 81 skips 13 tests without it.
# Required-check status (ruleset 20330619) is Trevor's decision D-G and is NOT
# set by this file.

on:
  pull_request:
    paths:
      - '44-convert-and-flow-operator/**'
      - '49-signature-funnel/**'
      - '50-email-engine/**'
      - '71-blackceo-signature-page/**'
      - '78-signature-product-selection/**'
      - '79-signature-order-form/**'
      - '80-signature-upsell/**'
      - '81-signature-downsell/**'
      - '82-signature-thank-you/**'
      - '83-black-friday-launcher/**'
      - 'shared-utils/signature_launch*/**'
      - 'shared-utils/client_intake/**'
      - 'universal-sops/funnel-craft/**'
      - 'scripts/bump-version.sh'
      - 'scripts/check-doc-currency-guards.sh'
      - '.github/workflows/launch-family-seams.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  launch-family-seams:
    name: launch-family-seams
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --quiet jsonschema pytest pillow==10.4.0

      - name: Required files present (a missing test is red, never skipped)
        run: |
          missing=0
          for f in \
            49-signature-funnel/scripts/test_thankyou_translator.py \
            49-signature-funnel/scripts/test_upsell_wrapper.py \
            49-signature-funnel/scripts/test_downsell_wrapper.py \
            49-signature-funnel/scripts/test_sop_lockstep.py \
            49-signature-funnel/scripts/test_compile_launch_route.py \
            78-signature-product-selection/tests/test_selection_binding_native_ids.py \
            79-signature-order-form/tests/test_schema_lockstep_44.py \
            80-signature-upsell/verify.py \
            50-email-engine/tests/test_seam_49_to_44.py \
            shared-utils/signature_launch/tests/test_schema_copies_identical.py \
            scripts/bump-version.sh \
            scripts/check-doc-currency-guards.sh ; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; missing=1; fi
          done
          for d in 78-signature-product-selection/tests 79-signature-order-form/tests \
                   81-signature-downsell/tests 82-signature-thank-you/tests ; do
            if [ ! -d "$d" ]; then echo "MISSING DIR: $d"; missing=1; fi
          done
          exit "$missing"

      - name: 49 thank-you translator
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 49-signature-funnel/scripts/test_thankyou_translator.py
      - name: 49 upsell wrapper
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 49-signature-funnel/scripts/test_upsell_wrapper.py
      - name: 49 downsell wrapper
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 49-signature-funnel/scripts/test_downsell_wrapper.py
      - name: 49 route graph hash (issue 56)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 49-signature-funnel/scripts/test_compile_launch_route.py
      - name: 49 SOP-LOCKED lockstep (issue 41)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 49-signature-funnel/scripts/test_sop_lockstep.py
      - name: 78 tests (includes the 78 to 79 adapter test, issue 11)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s 78-signature-product-selection/tests
      - name: 79 tests (includes the 44 schema lockstep, issue 53)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s 79-signature-order-form/tests
      - name: 80 verify
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 80-signature-upsell/verify.py
      - name: 81 tests
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s 81-signature-downsell/tests
      - name: 82 tests
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s 82-signature-thank-you/tests
      - name: Seam 49 to 50 to 44 (issue 14)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s 50-email-engine/tests -p 'test_seam_49_to_44.py'
      - name: Page-request schema copies identical (issue 85)
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" python3 -m unittest discover -s shared-utils/signature_launch/tests -p 'test_schema_copies_identical.py'
      - name: Fast guard, version markers
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" bash scripts/bump-version.sh --check
      - name: Fast guard, doc currency
        if: always()
        run: env -i HOME="$(mktemp -d)" PATH="$PATH" bash scripts/check-doc-currency-guards.sh
