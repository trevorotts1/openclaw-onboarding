# ONE macOS job (checks-compress). Three macOS jobs used to run in three workflows:
#   hardening-and-fleet-standards-exec-guard (LIVE watchdog + whisper probe),
#   script-defect-classes-guard (bash 3.2 parses every tracked shell script),
#   presentation-release-matrix (macOS runner acceptance: native render + OCR + tick).
# The account runs only 5 macOS jobs at once, so they are one job here, and each part runs
# only when its own files changed (scripts/ci/macos-acceptance-paths.json holds each part's
# paths for pull_request and push; scripts/ci/macos_acceptance_select.py applies them).
# On the nightly schedule and a manual run every part runs. The Linux Docker legs of the
# presentation matrix stay in presentation-release-matrix.yml.
