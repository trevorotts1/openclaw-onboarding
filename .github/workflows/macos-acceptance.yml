  schedule:
  - cron: 23 7 * * *
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  macos-acceptance:
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: macOS acceptance (hardening watchdog, bash 3.2 parse, presentation render)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Which macOS parts does this change need?
      id: sel
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        python3 scripts/ci/macos_acceptance_select.py
    - name: 'Hardening: bash 3.2 parses the hardening script'
      run: /bin/bash -n scripts/install-hardening.sh
      if: ${{ !cancelled() && steps.sel.outputs.hardening == 'true' }}
    - name: 'Hardening: LIVE -- hung brew is killed, helper reaped, caller survives'
      run: |
        chmod +x tests/unit/hardening-bounded-brew-and-whisper-probe.test.sh
        bash tests/unit/hardening-bounded-brew-and-whisper-probe.test.sh
      if: ${{ !cancelled() && steps.sel.outputs.hardening == 'true' }}
    - name: 'Hardening: Fleet standards keeps tools.exec.mode (no legacy security/ask rewrite)'
      run: |
        chmod +x tests/unit/fleet-standards-legacy-exec-mode.test.sh
        bash tests/unit/fleet-standards-legacy-exec-mode.test.sh
      if: ${{ !cancelled() && steps.sel.outputs.hardening == 'true' }}
    - name: 'bash 3.2: /bin/bash -n'
      run: |
        /bin/bash --version | head -1
        rc=0; n=0
        while IFS= read -r -d '' f; do
          n=$((n+1))
          /bin/bash -n "$f" || { echo "FAIL $f"; rc=1; }
        done < <(git ls-files -z '*.sh')
        echo "parsed $n tracked .sh files with /bin/bash"
        exit $rc
      if: ${{ !cancelled() && steps.sel.outputs.bash32 == 'true' }}
    - name: 'Presentation: Set up Python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
      if: ${{ !cancelled() && steps.sel.outputs.presentation == 'true' }}
    - name: 'Presentation: Install native render deps (Homebrew)'
      run: |
        set -euo pipefail
        brew install --cask libreoffice || brew install libreoffice
        brew install poppler tesseract ffmpeg
        python3 -m pip install --upgrade pip
        python3 -m pip install -r 23-ai-workforce-blueprint/templates/role-library/presentations/release-matrix/requirements-hostinger.txt
      if: ${{ !cancelled() && steps.sel.outputs.presentation == 'true' }}
    - name: 'Presentation: Record host identity receipt'
      run: |
        set -euo pipefail
        {
          echo "os=$(sw_vers -productName) $(sw_vers -productVersion) $(uname -m)"
          echo "python=$(python3 --version)"
          echo "soffice=$(soffice --version | head -1)"
          echo "pdftoppm=$(pdftoppm -v 2>&1 | head -1)"
          echo "tesseract=$(tesseract --version 2>&1 | head -1)"
          echo "ffmpeg=$(ffmpeg -version 2>&1 | head -1)"
          echo "fonts=$(fc-list | grep -ciE 'dejavu|liberation')"
        } | tee release-matrix-macos-identity.txt
      if: ${{ !cancelled() && steps.sel.outputs.presentation == 'true' }}
    - name: 'Presentation: Run PRES-043 battery (native Mac leg)'
      run: |
        set -euo pipefail
        cd 23-ai-workforce-blueprint/templates/role-library/presentations/scripts/tests
        python3 -m pytest test_pres043_release_matrix.py -q
      if: ${{ !cancelled() && steps.sel.outputs.presentation == 'true' }}
    - name: 'Presentation: Scheduler install render (sandboxed HOME, stub launchctl)'
      run: |
        set -euo pipefail
        chmod +x tests/unit/presentation-schedules-installed.test.sh
        bash tests/unit/presentation-schedules-installed.test.sh
      if: ${{ !cancelled() && steps.sel.outputs.presentation == 'true' }}
