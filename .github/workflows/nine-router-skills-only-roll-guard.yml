name: 9Router skills-only roll guard

# The fleet roll's 999 step on a box that already runs 9Router must be the
# installer's `--skills-only` and nothing else, behind a before/after checksum
# guard (shared-utils/nine_router_guard.py). The full installer replaces
# ~/.claude/skills/nine-router-setup and can touch the claude-nine launcher.
# tests/unit/nine-router-skills-only-roll.test.py goes red if the 9Router path
# is ever handed any other argument, reaches the link path, or the guard stops
# noticing a changed router/launcher file. Hermetic: fixture homes, no network,
# no fleet box, no credentials. No GitHub event field reaches a run: block.

on:
  push:
    branches: [main]
    paths:
      - "shared-utils/nine_router_guard.py"
      - "shared-utils/fleet_refresh_runner.py"
      - "shared-utils/lib-frontdoor.sh"
      - "scripts/fleet-refresh.sh"
      - "tests/unit/nine-router-skills-only-roll.test.py"
      - ".github/workflows/nine-router-skills-only-roll-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared-utils/nine_router_guard.py"
      - "shared-utils/fleet_refresh_runner.py"
      - "shared-utils/lib-frontdoor.sh"
      - "scripts/fleet-refresh.sh"
      - "tests/unit/nine-router-skills-only-roll.test.py"
      - ".github/workflows/nine-router-skills-only-roll-guard.yml"

jobs:
  nine-router-skills-only-roll-guard:
    name: 9Router box gets only --skills-only, guarded by checksums
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check the blast radius
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/fleet-refresh.sh
          bash -n shared-utils/lib-frontdoor.sh
          python3 -m py_compile shared-utils/nine_router_guard.py shared-utils/fleet_refresh_runner.py

      - name: Run the 9Router skills-only roll suite
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/unit/nine-router-skills-only-roll.test.py
          python3 tests/unit/fleet-refresh-roll-safety.test.py
          echo "nine-router-skills-only-roll-guard: PASS"
