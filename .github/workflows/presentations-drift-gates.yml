name: presentations-drift-gates

# Three continuous-integration drift gates for the presentation pipeline, added
# after two landmines each passed a green 93-check CI on the same PR:
#
#   Problem 1: fix_bundle_complete.py's canonical DELIVERABLE_AUDIT_SPEC symbol
#   went missing, silently breaking curate.py's import (and everything that
#   imports curate.py, including presentation_job.phases) on main -- with no
#   CI job noticing because nothing did a bare import-smoke of the package.
#
#   Problem 2: PR #884 stripped the trailing newline from
#   universal-sops/presentation-slide-craft/PIPELINE-MANIFEST.json without
#   restamping MANIFEST-SOURCE.txt's recorded content_sha256, breaking
#   manifest_source.py's sync_check and bricking presentation-canonical-entry.sh
#   GATE 3 -- with no CI job noticing because nothing recomputed the hash.
#
# scripts/ci/presentations-drift-gates.sh runs five gates and exits non-zero
# on any real failure, naming which gate failed and why:
#   GATE 1 - import smoke (presentation_job.phases) -- catches the Problem-1 class.
#   GATE 2 - manifest lockstep, BOTH registries: PIPELINE-MANIFEST.json <->
#            MANIFEST-SOURCE.txt (2a) and PIPELINE-MANIFEST.json <->
#            universal-sops/_content-manifest.json (2b) -- catches the
#            Problem-2 class in the registry the drift actually moved to.
#   GATE 3 - deliverable whitelist parity, FAIL-CLOSED with no skip path:
#            presentation_job/deliverables.py (U05) is canon, and all four real
#            consumers (fix_bundle_complete.py, presentation_job/curate.py,
#            phase_verifiers.py, self_audit.py) must match it exactly, or omit
#            only keys pre-declared in the script's _ALLOWED_SUBSETS map with a
#            written reason. Import errors and missing symbols are hard failures.
#            (The pre-U05 version of this gate always printed
#            GATE3_SKIP_WITH_REASON and exited 0 -- a no-op wearing a GATE 3
#            label. That skip path is gone.)
#   GATE 4 - phase-doc lockstep: 00-START-HERE.md and SOP-SLIDE-05-PROCESS-MANIFEST.md
#            must each name (backtick-quoted) every current `phases[].id` in
#            PIPELINE-MANIFEST.json. Added after both docs were found describing an
#            obsolete 21-step / 12-phase scheme that matched none of the (then) 36
#            live phases, unnoticed for months because nothing checked it.
#   GATE 5 - manifest-copy drift detector (FIX 32): proves the detector that
#            compares the two PIPELINE-MANIFEST.json copies (repo cluster vs
#            materialized department) by canonical-JSON content sha. A scratch
#            one-field change at the SAME manifest_version must trip M1 in
#            sync_check.py --json; a byte-level reformat and an identical copy
#            must not. The live broken state (2026-08-31): repo v52 vs
#            materialized v51, every per-copy provenance check green on both.
#            At launch the same M1 check runs inside presentation-canonical-entry.sh
#            GATE 3 (sync_check --json) and fails closed (class render_path).
#
# This job's path filter deliberately covers the exact files each gate reads,
# since none of those files are in presentations-lockstep.yml's trigger list
# (that job never fires on a fix_bundle_complete.py-only or
# MANIFEST-SOURCE.txt-only change -- the precise blind spot both landmines
# exploited).
#
# FIX 74 (2026-09-02): the job is now a two-platform MATRIX -- both legs run the
# same gates on GitHub's ubuntu runner, but with OPENCLAW_PLATFORM set to `mac`
# and `vps` respectively, matching how every platform-aware presentation reader
# resolves its paths/secrets (oc_paths.py, qc-completeness.sh v10.15.44/10.16.43,
# the install.sh MAC/VPS arms). A PR that renames a secret name (e.g.
# BRAVE_SEARCH_API_KEY) or changes a reader's platform-keyed behavior in ONE
# reader now fails the matrix leg whose platform the old name only resolves on,
# instead of passing a single-`mac`-flavored CI that never exercised the vps
# resolution. The Skill 51 (Signature Presentation) verify.sh gate -- previously
# only reachable via presentations-lockstep.yml -- runs here too, on BOTH legs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      # Gate script itself
      - "scripts/ci/presentations-drift-gates.sh"
      # GATE 1 targets -- the import-smoke surface (presentation_job package + its
      # sibling fix_bundle_complete.py / phase_verifiers.py, imported transitively
      # via presentation_job/curate.py)
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/presentation_job/**"
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/fix_bundle_complete.py"
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/phase_verifiers.py"
      # GATE 3 targets -- the fourth canon consumer (deliverables.py and curate.py
      # are already covered by the presentation_job/** glob above)
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/self_audit.py"
      # GATE 5 targets -- the FIX-32 manifest-copy drift detector + its resolver
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/sync_check.py"
      - "23-ai-workforce-blueprint/templates/role-library/presentations/scripts/manifest_source.py"
      # GATE 2 targets -- all three manifest hash registries
      - "universal-sops/presentation-slide-craft/PIPELINE-MANIFEST.json"
      - "universal-sops/presentation-slide-craft/MANIFEST-SOURCE.txt"
      - "universal-sops/_content-manifest.json"
      # GATE 4 targets -- the manifest (already listed above) plus the two docs
      # whose phase-id lists must stay a superset of PIPELINE-MANIFEST.json phases[]
      - "23-ai-workforce-blueprint/templates/role-library/presentations/00-START-HERE.md"
      - "universal-sops/presentation-slide-craft/SOP-SLIDE-05-PROCESS-MANIFEST.md"
      # Skill 51 self-verification (verify.sh) — FIX 74 now gates it on both legs
      - "51-signature-presentation/**"
      # Skill-23 engine script verify.sh resolves against (register --check leg)
      - "23-ai-workforce-blueprint/scripts/register-library-additions.py"
      # This workflow file
      - ".github/workflows/presentations-drift-gates.yml"

jobs:
  presentations-drift-gates:
    name: drift-gates + Skill-51 verify.sh (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both legs run on ubuntu-latest; the platform split is the same
        # OPENCLAW_PLATFORM environment variable the fleet's readers use to
        # resolve paths/secret stores (Mac = ~/.openclaw, VPS = /data/.openclaw).
        # macOS runners cost 10x and prove nothing extra here: the gates are
        # python/bash with no platform-native binary in either leg.
        platform: [mac, vps]
    env:
      OPENCLAW_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Announce matrix leg
        shell: bash
        run: |
          set -euo pipefail
          echo "OPENCLAW_PLATFORM=${OPENCLAW_PLATFORM} leg: drift gates + Skill-51 verify.sh"

      - name: presentations-drift-gates.sh — GATE 1 / GATE 2 / GATE 3 / GATE 4 / GATE 5 (exit 0 required)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci/presentations-drift-gates.sh
          bash scripts/ci/presentations-drift-gates.sh

      - name: 51-signature-presentation/verify.sh — Skill 51 self-verification (exit 0 required)
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_SH="51-signature-presentation/verify.sh"
          if [ ! -f "$VERIFY_SH" ]; then
            echo "FATAL: verify.sh not found at $VERIFY_SH" >&2
            exit 2
          fi
          chmod +x "$VERIFY_SH"
          # Same gate presentations-lockstep.yml runs: five prover self-tests,
          # sacred-structure pin, engine wire-presence, sync_check lockstep,
          # manifest P-SP phase + AF-SP floor, prover resolvability, register
          # --check, FIX-14 self-test, FIX-19 sliced read, FIX-18 self-test.
          # On the vps leg OPENCLAW_PLATFORM=vps proves the CI-safe subset of
          # those checks holds under VPS path resolution too.
          bash "$VERIFY_SH"
          echo "verify.sh: Skill 51 self-verification PASSED (OPENCLAW_PLATFORM=${OPENCLAW_PLATFORM})."
