name: script defect classes guard (roster shape, CC DB decoys, GNU stat, retire, update path, embedding probe, platform)

# One regression test per defect class fixed together:
#   A  agents.entries roster (OpenClaw 2026.9.x) read AND written by the scripts
#      that only knew agents.list[]           -> agents-entries-roster-readers,
#                                                 agents-entries-remaining-readers
#   B  mission-control.db resolver skips 0-byte / no-board decoys
#                                              -> cc-db-decoy-resolver
#   C  GNU `stat -c` first (BSD-first chains print filesystem status on Linux)
#                                              -> gnu-stat-first (native GNU here)
#   D  retire-confirmed-decline.sh: entries roster, the workspace departments
#      tree the vertical gate reads, build states without companySlug
#                                              -> retire-decline-separate-workspace
#   E  a verified update.sh run stamps commandCenterBuildFresh
#                                              -> cc-update-path-build-fresh
#   F  embedding probe judges shipped-asset rows by release, not build date
#                                              -> embedding-probe-shipped-asset
#   G  platform label / root agree with platform/common.sh
#                                              -> platform-detection-parity
#
# Hermetic: every test sandboxes HOME, clears the DB env vars and stubs
# openclaw / curl / uname where a script would call them.

