name: SF prover pin authority

# ── ENF-14 / ENF-15: who holds the Skill 49 / 83 launch-path pin ─────────────
#
# 49-signature-funnel/scripts/SF-PROVER-PIN.sha256 is the digest of every file the dispatch/launch path
# executes or reads for decisions (generated by scripts/front_door.py: all non-test Skill 49 scripts and
# data, the Skill 83 launcher tree, the shared launch contract and package). An AI session that can edit a
# prover and re-run --write-pin would certify its own edit, so the pin has ONE minting path: this workflow.
#
#   verify  pull_request / tag push : recompute the pin from the proposed tree and FAIL on mismatch. The
#                                     TRUSTED verifier (the BASE branch's front_door.py) judges the PR tree:
#                                     it reads the PR's _PIN_SPEC as data only, refuses a spec that drops any
#                                     rule the trusted spec pins, and recomputes the digest itself, so a spec
#                                     change that adds pinned files passes once minted while a PR verifier that
#                                     certifies itself cannot. The bypass scan runs from trusted code too. The
#                                     base-tree recheck and the PR verifier's own hashpin and scan still run as
#                                     extra signals: they can add a failure, never remove one. A base without
#                                     front_door.py (the PR that introduces it) has no trusted code: it runs the
#                                     PR checks and warns; its pin comes from the mint job after merge. A PR
#                                     whose net diff edits the pin file fails unless every commit touching it
#                                     is bot-authored, bot-committed and touches only the pin.
#   mint    push to main / manual   : the merge is the authority. Recompute, and commit the pin as
#                                     github-actions[bot] when it changed. `mint-pin --ci` refuses to run
#                                     anywhere else, and the local `--write-pin` needs a signed pin_rotation
#                                     approval record held by the operator. 999 receives the pin only through
#                                     the sync script, never by minting its own.
#
# A batch that changes pinned files is therefore red on `verify` until the operator dispatches `mint` for
# the batch branch (Actions > SF prover pin authority > Run workflow > the branch). That is intended.
# After that mint on a PR branch, re-trigger verify with an empty commit (git commit --allow-empty) or by
# closing and reopening the PR: a re-run of the old run still checks the old head.
#
# Residual: a repo admin who can edit this workflow or push without review can still re-mint; protect this
# file and the pin path with CODEOWNERS and require the `verify` check.

on:
  pull_request:
    paths:
      - "49-signature-funnel/**"
      - "83-black-friday-launcher/**"
      - "71-blackceo-signature-page/**"
      - "shared-utils/signature_launch/**"
      - "shared-utils/signature_launch_contract/**"
      - ".github/workflows/sf-prover-pin-authority.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "49-signature-funnel/**"
      - "83-black-friday-launcher/**"
      - "71-blackceo-signature-page/**"
      - "shared-utils/signature_launch/**"
      - "shared-utils/signature_launch_contract/**"
      - ".github/workflows/sf-prover-pin-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-prover-pin-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Recompute the pin from the tree and fail on mismatch
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the proposed (or tagged) tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: tree

      - name: Checkout the trusted verifier (base branch, or main for a tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: trusted

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recompute the pin and run the bypass scan
        shell: bash
        run: |
          set -euo pipefail
          verifier="trusted/49-signature-funnel/scripts/front_door.py"
          if [ ! -f "$verifier" ]; then
            # Bootstrap (the PR that introduces front_door.py): there is no trusted code yet. The PR runs its
            # own bypass scan here and its own pin recompute in the last step; its pin is minted after merge.
            echo "::warning::bootstrap: no front_door.py on the base tree; pin is minted by the push-to-main mint job"
            python3 tree/49-signature-funnel/scripts/front_door.py --skill-dir tree/49-signature-funnel bypass-scan
            exit 0
          fi
          # (1) DECIDES: TRUSTED code recomputes the pin over the PR TREE. No PR code runs here. The PR's
          # _PIN_SPEC is read with ast.literal_eval (data, never executed) and must keep every rule the trusted
          # spec has, so a spec change that ADDS pinned files passes once minted. Pinned trees resolve exactly
          # as on the base tree (a decoy directory cannot take one over), and no two files may share a logical
          # name (an added rule cannot shadow a pinned file with an unmodified copy). A PR verifier that
          # certifies itself is itself a pinned file, so its committed pin no longer matches and this aborts.
          python3 -I - "$verifier" tree/49-signature-funnel/scripts/front_door.py trusted/49-signature-funnel tree/49-signature-funnel <<'PY'
          import ast, importlib.util, sys
          from pathlib import Path

          trusted, pr, base_skill, tree_skill = sys.argv[1:5]
          spec = importlib.util.spec_from_file_location("trusted_front_door", trusted)
          fd = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fd)

          def die(msg):
              raise SystemExit(f"ABORT [HASH-PIN]: {msg}")

          def rules(pin_spec):
              out = []
              for prefix, key, subs in pin_spec:
                  for sub, pattern in subs:
                      if not all(isinstance(x, str) for x in (prefix, key, sub, pattern)):
                          die("the PR _PIN_SPEC holds a non-string entry")
                      out.append((prefix, key, sub, pattern))
              return out

          pr_spec = None
          if Path(pr).is_file():
              for node in ast.parse(Path(pr).read_text(encoding="utf-8")).body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "_PIN_SPEC" for t in node.targets):
                      pr_spec = ast.literal_eval(node.value)
          if pr_spec is None:
              print("::warning::no literal _PIN_SPEC on the PR tree; the trusted spec judges it")
              pr_spec = fd._PIN_SPEC
          dropped = sorted(set(rules(fd._PIN_SPEC)) - set(rules(pr_spec)))
          if dropped:
              die("the PR narrows the pin spec; it no longer pins: " + ", ".join("|".join(r) for r in dropped))

          base, tree = Path(base_skill).resolve(), Path(tree_skill).resolve()
          dirs = fd._skill_dirs(tree)
          for key, path in fd._skill_dirs(base).items():
              was, now = path.relative_to(base.parent), dirs[key].relative_to(tree.parent)
              if was != now:
                  die(f"pinned tree {key} resolves to {now} on the PR tree, {was} on the base tree")
          for _prefix, key, _sub, _pattern in rules(pr_spec):
              if key not in dirs:
                  hits = [p for p in sorted(tree.parent.iterdir())
                          if p.is_dir() and p.name.startswith(key + "-") and (p / "SKILL.md").is_file()]
                  if len(hits) != 1:
                      die(f"the trusted verifier cannot resolve new pinned tree {key!r}; land its resolver on main first")
                  dirs[key] = hits[0]
          found = {}
          for prefix, key, sub, pattern in rules(pr_spec):
              d = dirs[key] / sub if sub else dirs[key]
              for p in sorted(d.glob(pattern)) if d.is_dir() else []:
                  if p.is_file() and not fd._is_test(p.name):
                      name = f"{prefix}/{p.relative_to(dirs[key]).as_posix()}"
                      if found.setdefault(name, p) != p:
                          die(f"two pinned files claim the name {name}: {found[name]} and {p}")
          fd._PIN_SPEC = pr_spec
          fd._skill_dirs = lambda _skill_dir: dirs
          print(f"trusted hash-pin over the PR tree verified: {fd.step_hashpin(tree)}")
          PY
          # (2) DECIDES: the bypass scan over the PR tree runs from trusted code.
          python3 "$verifier" --skill-dir tree/49-signature-funnel bypass-scan
          # (3) Extra signal (set -e: it can add a failure, never remove one): the base tree still matches the
          # base pin, so the PR did not quietly alter what the old spec asserts.
          python3 "$verifier" --skill-dir trusted/49-signature-funnel hashpin
          # ponytail: the trusted check hashes with the BASE algorithm and resolves new trees only by the
          # numbered-skill convention, so a PR that changes how the pin is computed, drops a pin rule, adds a
          # non-numbered tree, or adds a network allow-list entry stays red: land the verifier change on main in
          # its own operator-reviewed PR first. Upgrade path: CODEOWNERS on front_door.py and this workflow.

      - name: Refuse a hand-edited pin file
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd tree
          pin="49-signature-funnel/scripts/SF-PROVER-PIN.sha256"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          # A minted-then-reverted pin (empty net diff) is fine.
          if [ -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$pin")" ]; then
            exit 0
          fi
          # ponytail: author/committer emails can be spoofed locally; the trusted-base hashpin recompute in the
          # previous step is the check that cannot be talked around (a spoofed pin can only certify the PR's
          # own reviewed tree).
          while read -r sha ae ce; do
            [ -n "$sha" ] || continue
            if [ "$ae" != "$bot" ] || [ "$ce" != "$bot" ]; then
              echo "::error::$pin was changed by commit $sha (author $ae, committer $ce). Only the mint job of this workflow may write it."
              exit 1
            fi
            others="$(git diff-tree --no-commit-id --name-only -r "$sha" | awk -v p="$pin" '$0 != p')"
            if [ -n "$others" ]; then
              echo "::error::mint commit $sha touches files besides $pin"
              exit 1
            fi
          done < <(git log --format='%H %ae %ce' "$BASE_SHA..$HEAD_SHA" -- "$pin")

      - name: Extra signal, the PR's own verifier (can add a failure, never remove one)
        shell: bash
        run: |
          set -euo pipefail
          # Runs LAST so that PR code cannot touch the checkout before the trusted checks or the authorship
          # rule above have decided. It cannot pass anything those failed.
          pr_verifier="tree/49-signature-funnel/scripts/front_door.py"
          if [ ! -f "$pr_verifier" ]; then
            echo "no front_door.py on the PR tree; the trusted hashpin above already failed or judged it"
            exit 0
          fi
          python3 "$pr_verifier" --skill-dir tree/49-signature-funnel hashpin
          python3 "$pr_verifier" --skill-dir tree/49-signature-funnel bypass-scan

  mint:
    name: Mint the pin (the only minting path)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the merged branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bypass scan before certifying anything
        shell: bash
        run: |
          set -euo pipefail
          python3 49-signature-funnel/scripts/front_door.py --skill-dir 49-signature-funnel bypass-scan

      - name: Mint and commit the pin
        shell: bash
        run: |
          set -euo pipefail
          python3 49-signature-funnel/scripts/front_door.py --skill-dir 49-signature-funnel mint-pin --ci
          if git diff --quiet -- 49-signature-funnel/scripts/SF-PROVER-PIN.sha256; then
            echo "pin already matches the tree; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 49-signature-funnel/scripts/SF-PROVER-PIN.sha256
          git commit -m "ci: mint SF-PROVER-PIN.sha256 for ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF}"
