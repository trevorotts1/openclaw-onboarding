name: SF prover pin authority

# ── ENF-14 / ENF-15: who holds the Skill 49 / 83 launch-path pin ─────────────
#
# 49-signature-funnel/scripts/SF-PROVER-PIN.sha256 is the digest of every file the dispatch/launch path
# executes or reads for decisions (generated by scripts/front_door.py: all non-test Skill 49 scripts and
# data, the Skill 83 launcher tree, the shared launch contract and package). An AI session that can edit a
# prover and re-run --write-pin would certify its own edit, so the pin has ONE minting path: this workflow.
#
#   verify  pull_request / tag push : recompute the pin from the proposed tree and FAIL on mismatch. The
#                                     PR's OWN front_door.py judges the PR tree (a spec change that adds
#                                     pinned files mints a new pin the PR verifier reproduces, so an honest
#                                     composition change passes). The BASE verifier additionally rechecks the
#                                     BASE tree against the BASE pin (the PR cannot quietly alter what the old
#                                     spec asserts). A base without front_door.py (the PR that introduces it)
#                                     skips the base check with a warning and still runs the PR check; its pin
#                                     comes from the mint job after merge. A PR whose net diff edits the pin
#                                     file fails unless every commit touching it is bot-authored, bot-committed
#                                     and touches only the pin.
#   mint    push to main / manual   : the merge is the authority. Recompute, and commit the pin as
#                                     github-actions[bot] when it changed. `mint-pin --ci` refuses to run
#                                     anywhere else, and the local `--write-pin` needs a signed pin_rotation
#                                     approval record held by the operator. 999 receives the pin only through
#                                     the sync script, never by minting its own.
#
# A batch that changes pinned files is therefore red on `verify` until the operator dispatches `mint` for
# the batch branch (Actions > SF prover pin authority > Run workflow > the branch). That is intended.
# After that mint on a PR branch, re-trigger verify with an empty commit (git commit --allow-empty) or by
# closing and reopening the PR: a re-run of the old run still checks the old head.
#
# Residual: a repo admin who can edit this workflow or push without review can still re-mint; protect this
# file and the pin path with CODEOWNERS and require the `verify` check.

on:
  pull_request:
    paths:
      - "49-signature-funnel/**"
      - "83-black-friday-launcher/**"
      - "shared-utils/signature_launch/**"
      - "shared-utils/signature_launch_contract/**"
      - ".github/workflows/sf-prover-pin-authority.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "49-signature-funnel/**"
      - "83-black-friday-launcher/**"
      - "shared-utils/signature_launch/**"
      - "shared-utils/signature_launch_contract/**"
      - ".github/workflows/sf-prover-pin-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sf-prover-pin-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Recompute the pin from the tree and fail on mismatch
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the proposed (or tagged) tree
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: tree

      - name: Checkout the trusted verifier (base branch, or main for a tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          path: trusted

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recompute the pin and run the bypass scan
        shell: bash
        run: |
          set -euo pipefail
          base_verifier="trusted/49-signature-funnel/scripts/front_door.py"
          pr_verifier="tree/49-signature-funnel/scripts/front_door.py"
          pr_bootstrap=0
          base_bootstrap=0
          # (a) The PR's OWN verifier must reproduce the pin declared on the PR tree. A spec change
          # that adds pinned files mints a new pin the PR verifier reproduces, so an honest
          # composition change passes here where the old base-only recompute failed by construction.
          if [ ! -f "$pr_verifier" ]; then
            echo "::warning::bootstrap: no front_door.py on the PR tree; pin is minted by the push-to-main mint job"
            pr_bootstrap=1
          else
            python3 "$pr_verifier" --skill-dir tree/49-signature-funnel hashpin
          fi
          # (b) The BASE verifier must still reproduce the pin declared on the BASE tree. This proves
          # the PR did not quietly alter what the old spec asserts: if the PR weakened the shared
          # checker (or the base pin), the base tree no longer matches the base pin here.
          if [ ! -f "$base_verifier" ]; then
            echo "::warning::bootstrap: no front_door.py on the base tree; skipping the base-tree recheck"
            base_bootstrap=1
          else
            python3 "$base_verifier" --skill-dir trusted/49-signature-funnel hashpin
          fi
          # A tree without ANY verifier (the PR that introduces front_door.py) cannot be compared
          # against a pin: warn and let the mint job certify after merge.
          if [ "$pr_bootstrap" = 1 ] && [ "$base_bootstrap" = 1 ]; then
            echo "::warning::bootstrap: neither tree has a verifier; pin is minted by the push-to-main mint job"
            exit 0
          fi
          # The bypass scan sees the proposed code: prefer the PR tree's scanner, fall back to the
          # base verifier only when the PR deleted its own (the base hashpin above still gates).
          scanner="$pr_verifier"
          [ -f "$scanner" ] || scanner="$base_verifier"
          python3 "$scanner" --skill-dir tree/49-signature-funnel bypass-scan
          # ponytail: two hashpin gates (PR-own + base) plus the unchanged bot-mint authorship rule below are
          # the ceiling that fits in one workflow. A compromised PR verifier could certify its own weakened
          # tree, so do not rely on (a) alone: the base-tree recheck (b) plus the bot-mint authorship rule
          # (c) are what keep a weakened spec from passing. Upgrade path: an external allow-list of
          # verifier changes reviewed by the operator before the PR verifier is trusted.

      - name: Refuse a hand-edited pin file
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd tree
          pin="49-signature-funnel/scripts/SF-PROVER-PIN.sha256"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          # A minted-then-reverted pin (empty net diff) is fine.
          if [ -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$pin")" ]; then
            exit 0
          fi
          # ponytail: author/committer emails can be spoofed locally; the trusted-base hashpin recompute in the
          # previous step is the check that cannot be talked around (a spoofed pin can only certify the PR's
          # own reviewed tree).
          while read -r sha ae ce; do
            [ -n "$sha" ] || continue
            if [ "$ae" != "$bot" ] || [ "$ce" != "$bot" ]; then
              echo "::error::$pin was changed by commit $sha (author $ae, committer $ce). Only the mint job of this workflow may write it."
              exit 1
            fi
            others="$(git diff-tree --no-commit-id --name-only -r "$sha" | awk -v p="$pin" '$0 != p')"
            if [ -n "$others" ]; then
              echo "::error::mint commit $sha touches files besides $pin"
              exit 1
            fi
          done < <(git log --format='%H %ae %ce' "$BASE_SHA..$HEAD_SHA" -- "$pin")

  mint:
    name: Mint the pin (the only minting path)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the merged branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bypass scan before certifying anything
        shell: bash
        run: |
          set -euo pipefail
          python3 49-signature-funnel/scripts/front_door.py --skill-dir 49-signature-funnel bypass-scan

      - name: Mint and commit the pin
        shell: bash
        run: |
          set -euo pipefail
          python3 49-signature-funnel/scripts/front_door.py --skill-dir 49-signature-funnel mint-pin --ci
          if git diff --quiet -- 49-signature-funnel/scripts/SF-PROVER-PIN.sha256; then
            echo "pin already matches the tree; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 49-signature-funnel/scripts/SF-PROVER-PIN.sha256
          git commit -m "ci: mint SF-PROVER-PIN.sha256 for ${GITHUB_SHA::12}"
          git push origin "HEAD:${GITHUB_REF}"
