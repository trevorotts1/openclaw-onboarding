name: shared readiness projection guard (T-40)

# T-40 / R-28 / C-40 — "Affected rebind/disconnect/upgrade proof invalidation,
# installed/running/live distinct." The acceptance suite is named below by
# EXPLICIT FILE PATH (a check nothing runs is not a check), and the job is
# paired with an anti-vacuity step that re-runs the same file expecting rc 0.
# Hermetic: stdlib only, no network, no fleet box, no credentials.

on:
  push:
    branches: [main]
    paths:
      - "shared-utils/shared_readiness.py"
      - "tests/unit/shared-readiness-projection.test.py"
      - "32-command-center-setup/scripts/verify-tenant-readiness.py"
      - ".github/workflows/shared-readiness-projection-guard.yml"
  pull_request:
    branches: [main]
    paths:
      - "shared-utils/shared_readiness.py"
      - "tests/unit/shared-readiness-projection.test.py"
      - "32-command-center-setup/scripts/verify-tenant-readiness.py"
      - ".github/workflows/shared-readiness-projection-guard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared-readiness-projection-tests:
    name: "T-40 — shared readiness projection acceptance suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: T-40 acceptance suite (explicit file path)
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/unit/shared-readiness-projection.test.py
          echo "✓ tests/unit/shared-readiness-projection.test.py all pass"