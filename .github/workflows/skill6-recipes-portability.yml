name: Skill 6 recipe portability

on:
  pull_request:
    paths:
      - '06-ghl-install-pages/tools/playwright_recipes/**'
      - '06-ghl-install-pages/tools/browser_manager.py'
      - '06-ghl-install-pages/tools/ghl_auth.py'
      - '.github/workflows/skill6-recipes-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-fixture:
    name: Python and Chromium fixture (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SKILL6_BROWSER_FIXTURE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python runtime dependencies
        run: python -m pip install playwright requests
      - name: Install Chromium and Linux runtime libraries
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Mac
        if: runner.os == 'macOS'
        run: python -m playwright install chromium
      - name: Run offline contracts and mandatory real Chromium fixtures
        run: python -m unittest discover -s 06-ghl-install-pages/tools/playwright_recipes -p 'test_*.py' -v
