name: Skill 72 motion graphics tests (MG-043)

# Per-change gate for the Skill 72 Motion Graphics V2 build. Path-scoped
# to the skill (plus this workflow) so unrelated work never pays for it.
#
# fast-gate job: runs 72-motion-video-plus/tests/ci/run-fast-gate.sh,
# which is the single source of truth for the gate's commands:
#   1. verify.sh (install verifier, including the manifest schema
#      structure check and the tracked-files em dash scan)
#   2. npm run test:fast (render-free TypeScript suites: corpus,
#      charts, catalog, typography, layout, timeline, lint)
#   3. the Python unit suite (python3 -m unittest discover)
#   4. tests/check_matrix.py (T01-T34 registry consistency)
#   5. a sabotage self-test: the corpus suite re-run against fixtures
#      with one assembly input deleted must go RED, or the gate itself
#      fails. A gate that cannot go red is not a gate.
#
# clean-install job: runs the T03 clean-install test
# (72-motion-video-plus/tests/clean-install/run-clean-install.sh):
# a pristine git-archive copy of the skill and shared runtime is
# installed, provisioned (with the provisioner's real launch-and-render
# probe), and smoked. Heavier, so it runs as its own job.
#
# The heavy full suite (real renders through both engines) is NOT run
# here; it is the pre-release suite (npm test in the skill runtime) and
# runs on the integrated candidate per MG-048.

on:
  push:
    branches: [main]
    paths:
      - "72-motion-video-plus/**"
      - ".github/workflows/skill72-motion-graphics-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "72-motion-video-plus/**"
      - ".github/workflows/skill72-motion-graphics-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gate:
    # Batch pull requests run only the required checks (Trevor order 2026-11-13).
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: Skill 72 fast gate
    # Pinned: run-typography.ts asserts the sha256 of the installed Liberation
    # Sans files against the MG-006/MG-026 render-font evidence. Those bytes
    # are the Ubuntu 24.04 package fonts-liberation 1:2.1.5-3; the ubuntu-26.04
    # image that ubuntu-latest now resolves to ships 1:2.1.5-3build1, a
    # rebuild of the same 2.1.5 upstream with different file bytes, so the
    # font sha256 case failed there (main run 41892582499). 24.04 is the image
    # this job last went green on (main run 41118378440).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install "jsonschema==4.10.3"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 72-motion-video-plus/runtime/package-lock.json

      - name: Run the fast gate
        env:
          CI: "true"
        run: bash 72-motion-video-plus/tests/ci/run-fast-gate.sh

  clean-install:
    # Batch pull requests run only the required checks (Trevor order 2026-11-13).
    if: ${{ !startsWith(github.head_ref, 'batch/') }}
    name: Skill 72 clean install (T03)
    # Pinned to the same image as the fast gate.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install "jsonschema==4.10.3"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 72-motion-video-plus/runtime/package-lock.json

      - name: Run the clean-install test
        env:
          # The runner image already carries the Chromium system
          # libraries the provisioner would apt-install.
          MOTION_RUNTIME_SKIP_APT: "1"
        run: bash 72-motion-video-plus/tests/clean-install/run-clean-install.sh
