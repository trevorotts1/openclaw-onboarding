name: unit lane laws guard

# Makes scripts/qc-assert-unit-lane-laws.sh LIVE. The control suite proves the
# gate discriminates: one clean case must pass, and one case per law must fail on
# exactly that law. A gate that cannot fail is not a gate.
#
# The gate itself judges a LANE's inputs (base..head, PR numbers, transcript, QC
# verdict), so it is run by the lane and by QC, not here — CI has no transcript.
# What CI can and does prove on every change to these files is that the gate
# still separates a clean lane from each violation.
#
# Added 2026-11-09 with the gate. Scope: unit laws L4-L16, SCOPE-LEDGER.md
# INST-001 items 27-39.

on:
  pull_request:
    paths:
      - 'scripts/qc-assert-unit-lane-laws.sh'
      - 'tests/unit/qc-assert-unit-lane-laws.test.sh'
      - '.github/workflows/unit-lane-laws-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/qc-assert-unit-lane-laws.sh'
      - 'tests/unit/qc-assert-unit-lane-laws.test.sh'
      - '.github/workflows/unit-lane-laws-guard.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control:
    name: Control suite (the gate must discriminate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/qc-assert-unit-lane-laws.sh
          bash -n tests/unit/qc-assert-unit-lane-laws.test.sh
          echo "syntax OK"

      - name: Control suite
        shell: bash
        run: |
          set -uo pipefail
          bash tests/unit/qc-assert-unit-lane-laws.test.sh
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::control suite failed (rc=$rc) — the gate is not trustworthy"
            exit 1
          fi
          echo "control suite PASSED"
