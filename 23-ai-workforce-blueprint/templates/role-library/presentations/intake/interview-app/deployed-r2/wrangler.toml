# Presentation intake mini-app — Cloudflare Worker (API + UI via Static Assets)
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DOMAIN CHOICE IS FLAGGED, NOT GUESSED.                                    │
# │ The production hosting domain and Cloudflare account id are the           │
# │ OPERATOR's. Every placeholder below is written as <PLACEHOLDER> on        │
# │ purpose — fill them in at deploy time. Do not commit a real zone/account  │
# │ id to this file (see D2 reconciliation note in ../README.md).             │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Single-Worker deployment: one Worker serves the UI (Static Assets from
# ./public) for non-/api paths AND the API (/api/*, /healthz). Storage is
# R2-backed (env.STORE) — D1 was not provisionable with the API token's
# scopes available at deploy time (2026-08-18). See ../README.md for the full
# reconciliation against the D1-based worker/ contract in the parent app.
#
# Deploy:
#   wrangler deploy
#   wrangler r2 bucket create presentation-intake   (idempotent if it exists)
#   wrangler secret put INTAKE_ADMIN_TOKEN           (box->worker auth)
#   wrangler secret put COMMAND_CENTER_URL           (optional, CC board base URL)
#   wrangler secret put CC_DEPT_START_TOKEN          (optional, falls back to INTAKE_ADMIN_TOKEN)
#   add route: <PLACEHOLDER_FLEET_DOMAIN's presentation-interview subdomain>/* -> presentation-intake

name               = "presentation-intake"
main               = "src/index.js"
compatibility_date = "2024-09-23"

account_id = "<PLACEHOLDER_CF_ACCOUNT_ID>"

routes = [
  { pattern = "presentation-interview.<PLACEHOLDER_FLEET_DOMAIN>/*", zone_name = "<PLACEHOLDER_FLEET_DOMAIN>" }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[r2_buckets]]
binding     = "STORE"
bucket_name = "presentation-intake"

[observability]
enabled = true

# Secrets (NEVER in this file — set via `wrangler secret put`):
#   INTAKE_ADMIN_TOKEN   -- box->worker bearer for POST /api/sessions (session
#                           mint), POST /api/intake, GET /api/intake,
#                           GET /api/intake/list, POST /api/dept-start.
#                           The same value lives on the box as env
#                           INTAKE_ADMIN_TOKEN for intake_bridge.py.
#   COMMAND_CENTER_URL   -- the Command Center board base URL (used by
#                           /api/dept-start to POST /api/tasks/ingest). If
#                           unset, the trigger intent is recorded in R2 and
#                           the box-side cc_board.ingest_deck_task() creates
#                           the card on pick-up instead (no shortcuts).
#   CC_DEPT_START_TOKEN  -- bearer the CC board expects for ingest (optional;
#                           falls back to INTAKE_ADMIN_TOKEN).
