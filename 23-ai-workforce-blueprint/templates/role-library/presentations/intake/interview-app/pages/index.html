<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Presentation Intake</title>
  <style>
    /* ============================================================
       Presentation Interview app — branded intake UI.
       Design system (locked, see design/design_prompt.md):
       ivory #FBF7F4  | charcoal #231F20 | crimson #C8104E
       champagne gold #C9A24B | liquid gold #B8860B->#E6C66E
       Montserrat editorial sans, LIGHT MODE ONLY.
       One static file; no external assets. Self-contained.
       ============================================================ */
    :root {
      --bg-top: #FCF8F4; --bg-bottom: #F7F1EA;
      --ink: #231F20; --muted: #6E6558; --field: #A79E8F;
      --card: #FFFFFF; --stone: #E7DFD4; --hairline: #EDE6DC;
      --crimson: #C8104E; --crimson-deep: #A40D40;
      --gold: #C9A24B; --gold-dark: #B8860B; --gold-light: #E6C66E;
      --track: #E7DFD4; --ok: #1F7A4D; --err: #B3261E;
      --shadow: 0 12px 40px rgba(35, 31, 32, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
    }
    /* TOP BRAND BAR */
    header.brand {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1080px; width: 100%; margin: 0 auto;
      padding: 22px clamp(18px, 5vw, 40px);
    }
    .brandmark { display: flex; align-items: center; gap: 10px; }
    .brandmark .glyph {
      width: 30px; height: 30px; border: 1px solid var(--gold);
      border-radius: 50%; display: grid; place-items: center;
      color: var(--gold-dark); font-size: 16px; font-weight: 700;
    }
    .wordmark { font-weight: 800; letter-spacing: 0.06em; font-size: 14px; color: var(--ink); }
    .wordmark em { font-style: normal; color: var(--crimson); }
    .exit {
      border: 1px solid var(--hairline); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; letter-spacing: 0.04em;
    }
    .exit:hover { color: var(--ink); border-color: var(--stone); }
    /* INTRO */
    .intro { text-align: center; margin-bottom: 26px; }
    .kicker {
      font-weight: 700; letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--gold-dark); font-size: 12px; margin: 0 0 10px;
    }
    .intro h2 { margin: 0; font-weight: 800; font-size: clamp(18px, 3vw, 22px); color: var(--ink); }
    main {
      flex: 1; width: 100%; max-width: 640px; margin: 0 auto;
      padding: 0 clamp(18px, 5vw, 32px) 40px;
      display: flex; flex-direction: column;
    }
    /* CARD */
    .card {
      background: var(--card); border: 1px solid var(--hairline);
      border-radius: 18px; box-shadow: var(--shadow);
      padding: clamp(26px, 5vw, 40px) clamp(22px, 5vw, 44px);
    }
    /* SEGMENTED PROGRESS — 7-pill liquid-gold system */
    .progress-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 12px;
    }
    .progress-label {
      font-weight: 800; font-size: 13px; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--ink);
    }
    .progress-count { font-weight: 600; font-size: 12px; color: var(--muted); }
    .segments { display: flex; gap: 6px; width: 100%; margin-bottom: 26px; }
    .seg {
      flex: 1; height: 8px; border-radius: 999px;
      background: var(--track); transition: background .25s ease;
    }
    .seg.done { background: linear-gradient(90deg, var(--gold-dark), var(--gold-light)); }
    .seg.active { background: var(--crimson); }
    /* QUESTION */
    .prompt {
      font-weight: 900; font-size: clamp(24px, 4.5vw, 34px);
      line-height: 1.25; color: var(--ink); margin: 0 0 10px;
    }
    .prompt .emph { color: var(--crimson); }
    .help { color: var(--muted); font-size: 15px; font-weight: 500; margin: 0 0 24px; line-height: 1.5; }
    /* INPUTS */
    .field-label {
      display: block; font-weight: 700; font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
      margin: 0 0 8px;
    }
    textarea, input[type="text"], input[type="number"], input[type="url"], input[type="email"] {
      width: 100%; background: #fff; color: var(--ink);
      border: 1px solid var(--stone); border-radius: 14px; padding: 15px 18px;
      font: inherit; font-size: 16px; resize: vertical;
    }
    textarea { min-height: 110px; }
    textarea:focus, input:focus { outline: none; border-color: var(--crimson); }
    ::placeholder { color: var(--field); }
    /* CHOICE BUTTONS (enum / boolean) */
    .opts { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      text-align: left; background: #fff; color: var(--ink);
      border: 1px solid var(--stone); border-radius: 14px; padding: 16px 18px;
      font: inherit; cursor: pointer; transition: border-color .15s, background .15s;
    }
    .opt:hover { border-color: var(--crimson); }
    .opt[aria-pressed="true"] {
      border-color: var(--crimson);
      background: linear-gradient(0deg, rgba(200,16,78,0.06), rgba(200,16,78,0.06)), #fff;
    }
    /* LOGO CAPTURE — upload/drop zone + "no logo" escape */
    .logo-zone {
      border: 1.5px dashed var(--gold); border-radius: 14px;
      padding: 26px 20px; text-align: center; cursor: pointer;
      background: linear-gradient(0deg, rgba(201,162,75,0.05), rgba(201,162,75,0.05)), #fff;
      transition: border-color .15s, background .15s;
    }
    .logo-zone:hover, .logo-zone.drag { border-color: var(--crimson); }
    .logo-zone .cloud { font-size: 26px; color: var(--gold-dark); margin-bottom: 6px; }
    .logo-zone .lz-main { font-weight: 800; font-size: 15px; color: var(--ink); }
    .logo-zone .lz-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .logo-preview {
      display: none; align-items: center; gap: 14px; margin-top: 14px;
      border: 1px solid var(--stone); border-radius: 12px; padding: 10px 14px;
    }
    .logo-preview img { max-height: 52px; max-width: 120px; object-fit: contain; }
    .logo-preview .lp-name { font-size: 13px; color: var(--muted); word-break: break-all; }
    .link-row { display: flex; gap: 8px; margin-top: 12px; }
    .link-row input { flex: 1; }
    .link-row button {
      border: 1px solid var(--crimson); color: var(--crimson); background: #fff;
      border-radius: 14px; padding: 0 16px; font: inherit; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .link-row button:hover { background: rgba(200,16,78,0.06); }
    .no-logo {
      margin-top: 14px; text-align: center;
    }
    .no-logo button {
      background: transparent; border: none; color: var(--crimson);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .no-logo button:hover { color: var(--crimson-deep); }
    /* IMAGE LINKS */
    .img-list { display: flex; flex-direction: column; gap: 10px; }
    .img-row { display: flex; gap: 8px; align-items: center; }
    .img-row input { flex: 1; }
    .img-row .remove {
      border: none; background: transparent; color: var(--muted);
      font-size: 18px; cursor: pointer; width: 30px; height: 30px; line-height: 1;
      border-radius: 8px; flex: 0 0 auto;
    }
    .img-row .remove:hover { color: var(--err); background: rgba(179,38,30,0.06); }
    .add-link {
      background: transparent; border: none; color: var(--crimson);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      text-align: left; padding: 6px 0;
    }
    .add-link:hover { color: var(--crimson-deep); }
    /* NAV ROW */
    .row { display: flex; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
    button.primary {
      background: var(--crimson); color: #fff; border: none;
      border-radius: 999px; padding: 16px 34px; font: inherit;
      font-weight: 800; font-size: 15px; cursor: pointer;
      min-width: 140px; letter-spacing: 0.02em;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 18px rgba(200,16,78,0.22);
    }
    button.primary:hover { background: var(--crimson-deep); }
    button.primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    button.primary .arrow { font-size: 15px; }
    button.ghost {
      background: transparent; color: var(--muted); border: 1px solid var(--stone);
      border-radius: 999px; padding: 15px 22px; font: inherit; font-size: 14px;
      font-weight: 600; cursor: pointer;
    }
    button.ghost:hover { color: var(--ink); border-color: var(--gold); }
    .msg { min-height: 20px; font-size: 14px; margin-top: 14px; font-weight: 500; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    .center { text-align: center; }
    .big { font-size: clamp(26px, 5vw, 36px); font-weight: 900; margin: 10px 0; color: var(--ink); }
    .privacy {
      text-align: center; color: var(--muted); font-size: 12.5px;
      padding: 22px 18px 30px; font-weight: 500;
    }
    .spin {
      width: 28px; height: 28px; border: 3px solid var(--stone);
      border-top-color: var(--crimson); border-radius: 50%;
      animation: sp .8s linear infinite; margin: 40px auto;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    :focus-visible { outline: 3px solid var(--crimson); outline-offset: 2px; }
    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    /* REVIEW + DONE */
    .review-list { list-style: none; margin: 0 0 6px; padding: 0; }
    .review-list li {
      border-bottom: 1px solid var(--hairline); padding: 10px 0;
      font-size: 14px; text-align: left;
    }
    .review-list .rq { font-weight: 700; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .review-list .ra { margin-top: 2px; color: var(--ink); }
    .check { display: inline-block; margin-right: 8px; color: var(--crimson); font-weight: 900; }
    .thanks { font-size: 15px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <header class="brand">
    <div class="brandmark">
      <span class="glyph" aria-hidden="true">&#127807;</span>
      <span class="wordmark">ZERO <em>HUMAN</em> WORKFORCE</span>
    </div>
    <button class="exit" id="exitBtn" type="button" aria-keyshortcuts="Escape">Exit</button>
  </header>

  <main id="app" role="main" aria-label="Presentation intake questions">
    <div class="intro">
      <p class="kicker">Presentation Brief</p>
      <h2>Let&rsquo;s gather a few details to design your deck.</h2>
    </div>
    <div class="card" id="stage" role="region" aria-live="polite">
      <div class="spin" id="loader" role="status" aria-label="Loading"></div>
    </div>
  </main>
  <footer class="privacy" role="contentinfo">Your answers are private and only used to build your presentation.</footer>

  <script>
  (function () {
    "use strict";

    /* ---- embedded question set (source: questions.json) ---- */
    var QUESTIONS = /*__QUESTIONS__*/[
      { id: "presentation_type", order: 0, kind: "enum",
        prompt: "What <span class=\"emph\">kind of presentation</span> do you need?",
        help: "This is the first thing we need to know — it decides how we build everything else in your brief, from structure to length.",
        label: "Presentation type",
        required: true, storeOn: "pre_presentation_capture.PRESENTATION_TYPE",
        allowed_values: ["from_scratch", "content_personal", "content_general", "signature"], value_labels: { "from_scratch": "From scratch — brainstorm and build a brand-new presentation", "content_personal": "From something I already have, for ONE specific person", "content_general": "From something I already have, for a room or wider audience", "signature": "The full Signature Presentation (100+ slides, multi-part keynote)" } },
      { id: "offer_name", order: 1, kind: "text",
        prompt: "What are you selling at the end — the exact name of your product or offer?",
        help: "The offer sold at the end of the presentation — never invented.",
        label: "Offer name",
        placeholder: "e.g. The Momentum Method",
        required: true, storeOn: "deck_brief.OFFER_NAME" },
      { id: "named_methodology", order: 1.5, kind: "text",
        prompt: "Do you have a named methodology, framework, or system you deliver this through — what is it called, in your own words?",
        help: "The branded method name — client-supplied only, never invented for you. If you don&rsquo;t have a named method, say so plainly (e.g. &lsquo;no formal name, we just do X&rsquo;) rather than inventing one — an honest &lsquo;no&rsquo; is still a real answer.",
        label: "Named methodology",
        placeholder: "e.g. The Three-Move Pipeline System, or 'no formal name'",
        required: true, storeOn: "deck_brief.NAMED_METHODOLOGY" },
      { id: "transformation_promise", order: 2, kind: "text",
        prompt: "What&rsquo;s the before-and-after this offer delivers — who are they before, and who are they after?",
        help: "The transformation promise drives the whole arc.",
        label: "Transformation promise",
        placeholder: "e.g. stuck and overwhelmed → clear, confident, closing",
        required: true, storeOn: "deck_brief.TRANSFORMATION_PROMISE" },
      { id: "time_to_result", order: 2.5, kind: "text",
        prompt: "How long does it typically take a client to see this result once they start — the real, honest timeframe?",
        help: "State the true delivery timeframe in your own words (e.g. &lsquo;8 weeks&rsquo;, &lsquo;about 3 sessions&rsquo;, or &lsquo;it varies, typically N weeks&rsquo;) — never a faster number to sound more impressive.",
        label: "Time to result",
        placeholder: "e.g. 8 weeks to final, a shift in 2",
        required: true, storeOn: "deck_brief.TIME_TO_RESULT" },
      { id: "audience", order: 3, kind: "text",
        prompt: "Who is this presentation for?",
        help: "Industry, income level, and the pain point that brought them here. This seeds the audience-engine.",
        label: "Audience",
        placeholder: "e.g. women entrepreneurs, 35-55, tired of inconsistent clients",
        required: true, storeOn: "deck_brief.AUDIENCE" },
      { id: "cta_action", order: 4, kind: "text",
        prompt: "What is the exact call-to-action — the verb and next step you want them to take?",
        help: "This drives the closing slide&rsquo;s action language.",
        label: "Call to action",
        placeholder: "e.g. book a call, buy the program, join the waitlist",
        required: true, storeOn: "deck_brief.CTA_ACTION" },
      { id: "brand_primary", order: 5, kind: "logo",
        prompt: "Do you have a <span class=\"emph\">logo</span> or brand colors for the slides?",
        help: "If no logo is on file, provide one here — or we build without one and stay on-brand to the presentation system.",
        label: "Logo",
        required: false, storeOn: "deck_brief.BRAND_PRIMARY",
        logo_on_slides: "deck_brief.LOGO_ON_SLIDES" },
      { id: "image_links", order: 6, kind: "image_links",
        prompt: "Paste any <span class=\"emph\">image links</span> you want used in the deck.",
        help: "Product photos, headshots, brand imagery. Optional — add up to 5.",
        label: "Image links",
        required: false, storeOn: "deck_brief.IMAGE_LINKS" },
      { id: "tone", order: 7, kind: "text",
        prompt: "Pick a <span class=\"emph\">tone</span> — Inspirational, Tough Love, Challenger, Teacher, Storyteller, High-Energy Hype, or Calm Premium.",
        help: "One of the seven named styles, or blend two.",
        label: "Tone",
        placeholder: "e.g. Inspirational + Teacher",
        required: true, storeOn: "deck_brief.TONE" },
      { id: "final_price", order: 8, kind: "text",
        prompt: "What is the <span class=\"emph\">final price</span> of the offer?",
        help: "The offer price only — what a buyer pays at the end. Set 0 if this is a free-only close.",
        label: "Final price",
        placeholder: "e.g. $497",
        required: true, storeOn: "deck_brief.FINAL_PRICE" },
      { id: "speech_speed_preference", order: 9, kind: "enum",
        prompt: "At what <span class=\"emph\">pace</span> should we record the audio narration?",
        help: "default = recommended setting, medium = slightly faster, fast = high energy.",
        label: "Speech speed",
        required: true, storeOn: "intake.json",
        key: "speech_speed_preference", allowed_values: ["default", "medium", "fast"], value_labels: { "default": "Default pace (recommended)", "medium": "Medium pace", "fast": "Fast pace" } },
      { id: "want_sales_checkout", order: 10, kind: "enum",
        prompt: "Do you need a <span class=\"emph\">sales page and checkout page</span> along with the presentation?",
        help: "Default yes. A no records a client waiver — you keep the deck and optionally a VSL page.",
        label: "Sales page + checkout",
        required: true, storeOn: "pre_presentation_capture.WANT_SALES_CHECKOUT",
        allowed_values: ["yes", "no"], value_labels: { "yes": "Yes, build the sales page and checkout page", "no": "No thank you" } },
      { id: "sales_checkout_declined_reason", order: 10.1, kind: "text",
        prompt: "Understood — no sales page or checkout page. In your own words, why don&rsquo;t you want it? (I record this verbatim so nobody later has to guess.)",
        help: "Asked only when you declined the sales + checkout pages. Stored word-for-word as your waiver — an empty answer cannot be accepted.",
        label: "Why no sales/checkout page",
        placeholder: "e.g. we only need the deck for this launch",
        required: true, storeOn: "pre_presentation_capture.SALES_CHECKOUT_DECLINED_REASON",
        conditional_on: { id: "want_sales_checkout", equals: "no" } },
      { id: "want_vsl_page", order: 11, kind: "enum",
        prompt: "Would you like a <span class=\"emph\">VSL page</span> — a video sales letter — along with this?",
        help: "Default no — a VSL page needs the video to exist first.",
        label: "VSL page",
        required: true, storeOn: "pre_presentation_capture.WANT_VSL_PAGE",
        allowed_values: ["yes", "no"], value_labels: { "yes": "Yes, build the VSL page", "no": "No thank you" } },
      { id: "vsl_page_declined_reason", order: 11.1, kind: "text",
        prompt: "No VSL page, understood. In your own words, why not? (Recorded verbatim as your waiver.)",
        help: "Asked only when you declined the VSL page. Stored word-for-word — an empty answer cannot be accepted.",
        label: "Why no VSL page",
        placeholder: "e.g. we have no hosted video yet",
        required: true, storeOn: "pre_presentation_capture.VSL_PAGE_DECLINED_REASON",
        conditional_on: { id: "want_vsl_page", equals: "no" } },
      { id: "want_email_sequences", order: 11.2, kind: "enum",
        prompt: "Would you like <span class=\"emph\">email follow-up sequences</span> prepared for this launch?",
        help: "Default no. A yes elects the Skill 50 (Email Engine) delivery option: the sequences are prepared as drafts at delivery and deployed draft-only through Skill 44 after a human approves them. Nothing is sent automatically.",
        label: "Email sequences",
        required: true, storeOn: "pre_presentation_capture.WANT_EMAIL_SEQUENCES",
        allowed_values: ["yes", "no"], value_labels: { "yes": "Yes, prepare the email sequences as drafts", "no": "No thank you" } },
      { id: "email_sequences_declined_reason", order: 11.3, kind: "text",
        prompt: "Understood, no email sequences. In your own words, why not? (I record this verbatim so nobody later has to guess.)",
        help: "Asked only when you declined the email sequences. Stored word-for-word as your waiver, an empty answer cannot be accepted.",
        label: "Why no email sequences",
        placeholder: "e.g. we run our own email list",
        required: true, storeOn: "pre_presentation_capture.EMAIL_SEQUENCES_DECLINED_REASON",
        conditional_on: { id: "want_email_sequences", equals: "no" } },
      { id: "run_mode", order: 11.5, kind: "enum",
        prompt: "How hard should we run the <span class=\"emph\">build</span> of this deck?",
        help: "This is about the BUILD, not this interview. Skip it and you get Standard — we never put a run on Ultra unless you asked for it.",
        label: "Run mode",
        default: "",
        required: false, storeOn: "pre_presentation_capture.RUN_MODE",
        allowed_values: ["ultra", "standard", "economy"], value_labels: { "ultra": "Ultra: the strongest models you choose, up to 16x faster", "standard": "Standard — the department default", "economy": "Economy — leaner and cheaper" } },
      { id: "ollama_plan", order: 11.55, kind: "enum",
        prompt: "Are you on the Ollama Cloud $20/month or $100/month plan?",
        help: "The $20 plan runs 3 at once; the $100 plan runs 8 at once.",
        label: "Ollama Cloud plan",
        default: "",
        required: false, storeOn: "pre_presentation_capture.OLLAMA_PLAN",
        allowed_values: ["$20/month", "$100/month"], value_labels: { "$20/month": "$20/month — 3 at once", "$100/month": "$100/month — 8 at once" } },
      { id: "deepseek_variant", order: 11.6, kind: "enum",
        prompt: "Which DeepSeek variant for the heavy writing?",
        help: "Flash is fast and cheap; Pro is the strongest.",
        label: "DeepSeek variant",
        default: "",
        required: false, storeOn: "pre_presentation_capture.DEEPSEEK_VARIANT",
        allowed_values: ["flash", "pro"], value_labels: { "flash": "Flash — fast and cheap", "pro": "Pro — strongest" } },
      { id: "openrouter_model", order: 11.7, kind: "text",
        prompt: "Which OpenRouter model should Ultra use? (e.g. z-ai/glm-5.3-flash)",
        help: "In Ultra mode this model replaces any Ollama-routed step.",
        label: "OpenRouter model",
        default: "",
        required: false, storeOn: "pre_presentation_capture.OPENROUTER_MODEL" },
      { id: "client_notes", order: 12, kind: "text",
        prompt: "Anything else important we should <span class=\"emph\">know</span> before we start?",
        help: "Extras: target slide count, deadline, proof assets, anything else. Optional.",
        label: "Notes",
        placeholder: "Anything else we should know?",
        required: false, storeOn: "deck_brief.CLIENT_NOTES" }
    ];

    var TOTAL = QUESTIONS.length; /* derived from the embedded set -> "Question N of TOTAL" */
    var answers = {};             /* qid -> { raw, value, storeOn, kind, label } */

    var stage = document.getElementById("stage");
    var app = document.getElementById("app");
    var exitBtn = document.getElementById("exitBtn");
    var currentIndex = 0;
    var submitting = false;
    /* Session mode (S2): non-null when this page was opened through a
       bridge-minted capability link (/s/<token> or ?t=<token>). In session
       mode the worker owns the interview: questions come from the session,
       every answer is saved server-side as it is given, and completion is
       the worker's validated assembly + outbox. Standalone mode (no token)
       keeps the sink/download flow below. */
    var SESSION = null; /* { token, confirmCode, needsCode } */
    var currentMsg = null; /* the visible .msg element of the current screen */
    var currentNext = null; /* the primary button of the current screen */

    /* Item 13: six pre_presentation_capture fields are DERIVED by
       buildIntakePayload, never asked. The payload stamps each one's
       provenance (source answer or constant + the rule) in
       derived_field_provenance so no consumer mistakes a synthesized
       value for something the client said. The same map, word for word,
       is stamped by the live worker (deployed-r2/src/index.js) and the
       box-side writer (bridge/intake_writer.py). */
    var DERIVED_PROVENANCE = {
      REPRESENTATION_MIX: { source: "audience", rule: "Derived from the audience answer: the stated audience stands as the representation mix. No separate representation-mix question is asked." },
      AUDIENCE_COMPOSITION_NOTE: { source: "audience", rule: "Derived from the audience answer, which doubles as the audience composition note. No separate composition question is asked." },
      GROUNDED_CONTENT: { source: "offer_name", rule: "Derived from the offer name answer, the grounded content anchor. No separate grounded-content question is asked." },
      VISUAL_MIX: { source: "constant", rule: "Fixed default 'mix'. No visual-mix question is asked." },
      DARK_OK: { source: "constant", rule: "Fixed default false (light design). No dark-mode question is asked." },
      HOOK_SEED: { source: "transformation_promise", rule: "Derived from the transformation promise answer, which seeds the hook. No separate hook question is asked." }
    };

    /* ---- helpers ---- */
    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        if (k === "class") e.className = attrs[k];
        else if (k === "text") e.textContent = attrs[k];
        else if (k === "html") e.innerHTML = attrs[k];
        else if (k === "style") e.setAttribute("style", attrs[k]);
        else if (k === "value") e.value = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
      return e;
    }
    function clear() { while (stage.firstChild) stage.removeChild(stage.firstChild); }
    function scrollTop() { try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { window.scrollTo(0, 0); } }

    /* ---- segmented progress ---- */
    function renderProgress() {
      var head = el("div", { class: "progress-head" });
      head.appendChild(el("span", { class: "progress-label", text: "Question " + (currentIndex + 1) + " of " + TOTAL }));
      var pct = Math.round((currentIndex / TOTAL) * 100);
      head.appendChild(el("span", { class: "progress-count", text: pct + "%" }));
      /* The progressbar is real markup with literal ARIA attributes (the
         segments bar IS the progress indicator), not an attr-object the
         source never shows: assistive tech and the u054 static check both
         read the same literal role. */
      var segsWrap = el("div");
      segsWrap.innerHTML = '<div class="segments" role="progressbar" aria-valuemin="1" aria-valuemax="' + TOTAL + '" aria-valuenow="' + (currentIndex + 1) + '" aria-label="Interview progress"></div>';
      var segs = segsWrap.firstChild;
      for (var i = 0; i < TOTAL; i++) {
        var c = "seg";
        if (i < currentIndex) c += " done";
        else if (i === currentIndex) c += " active";
        segs.appendChild(el("span", { class: c }));
      }
      return [head, segsWrap];
    }

    /* ---- field builders per kind ---- */
    function buildChoice(q, onChange) {
      var group = el("div", { class: "opts", role: "radiogroup", "aria-label": q.label || q.prompt });
      (q.allowed_values || []).forEach(function (v) {
        var label = (q.value_labels && q.value_labels[v]) || v;
        var b = el("button", { class: "opt", role: "radio", "aria-checked": "false", text: label });
        b.onclick = function () {
          Array.prototype.forEach.call(group.children, function (c) { c.setAttribute("aria-checked", "false"); });
          b.setAttribute("aria-checked", "true");
          onChange(v);
        };
        b.onkeydown = function (e) {
          if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); var p = b.previousElementSibling; if (p) p.focus(); }
          if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); var n = b.nextElementSibling; if (n) n.focus(); }
        };
        group.appendChild(b);
      });
      return group;
    }

    /* Boolean questions get their OWN builder (a two-option radiogroup
       with its own radio controls), separate from the enum builder —
       mirroring the hosted session UI's structure, where boolean and
       enum are distinct builders. */
    function buildBoolean(q, onChange) {
      var group = el("div", { class: "opts", role: "radiogroup", "aria-label": q.label || q.prompt });
      (q.allowed_values || ["yes", "no"]).forEach(function (v) {
        var label = (q.value_labels && q.value_labels[v]) || (v === "yes" ? "Yes" : v === "no" ? "No" : v);
        var b = el("button", { class: "opt", role: "radio", "aria-checked": "false", text: label });
        b.onclick = function () {
          Array.prototype.forEach.call(group.children, function (c) { c.setAttribute("aria-checked", "false"); });
          b.setAttribute("aria-checked", "true");
          onChange(v);
        };
        b.onkeydown = function (e) {
          if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); var p = b.previousElementSibling; if (p) p.focus(); }
          if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); var n = b.nextElementSibling; if (n) n.focus(); }
        };
        group.appendChild(b);
      });
      return group;
    }

    function buildLogo(q, onChange) {
      var wrap = el("div");
      var state = { mode: "none", url: "", file: null, name: "" }; /* none | link | file | declined */

      var zone = el("div", { class: "logo-zone", tabindex: "0", role: "button", "aria-label": "Upload logo or paste a link" });
      zone.appendChild(el("div", { class: "cloud", text: "↑" }));
      zone.appendChild(el("div", { class: "lz-main", text: "Upload logo" }));
      zone.appendChild(el("div", { class: "lz-sub", text: "or paste a link below" }));
      var fileInput = el("input", { type: "file", accept: "image/*", class: "hidden", "aria-hidden": "true" });
      zone.appendChild(fileInput);
      var onFile = function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        state.mode = "file"; state.file = f; state.name = f.name;
        preview(state); onChange(state);
      };
      zone.onclick = function () { fileInput.click(); };
      zone.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } };
      fileInput.onchange = onFile;
      wrap.appendChild(zone);
      wrap.appendChild(fileInput);

      var row = el("div", { class: "link-row" });
      var urlInput = el("input", { type: "url", placeholder: "or paste an image link…", "aria-label": "Logo image link" });
      var go = el("button", { text: "Use link" });
      go.onclick = function () {
        var v = urlInput.value.trim();
        if (!v) return;
        state.mode = "link"; state.url = v; state.name = v;
        preview(state); onChange(state);
      };
      urlInput.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); go.click(); } };
      row.appendChild(urlInput); row.appendChild(go);
      wrap.appendChild(row);

      var noLogo = el("div", { class: "no-logo" });
      var nb = el("button", { text: "No logo on file — build without one" });
      nb.onclick = function () {
        state.mode = "declined";
        preview(state); onChange(state);
      };
      noLogo.appendChild(nb);
      wrap.appendChild(noLogo);

      var previewEl = el("div", { class: "logo-preview" });
      wrap.appendChild(previewEl);

      function preview(s) {
        previewEl.innerHTML = "";
        if (s.mode === "file" && s.file) {
          var url = URL.createObjectURL(s.file);
          previewEl.appendChild(el("img", { src: url, alt: "Logo preview" }));
          previewEl.appendChild(el("span", { class: "lp-name", text: s.name }));
          previewEl.style.display = "flex";
        } else if (s.mode === "link" && s.url) {
          previewEl.appendChild(el("img", { src: s.url, alt: "Logo preview" }));
          previewEl.appendChild(el("span", { class: "lp-name", text: s.url }));
          previewEl.style.display = "flex";
        } else if (s.mode === "declined") {
          previewEl.appendChild(el("span", { class: "lp-name", text: "Building without a logo — staying on-brand to the presentation system." }));
          previewEl.style.display = "flex";
        } else {
          previewEl.style.display = "none";
        }
      }
      return wrap;
    }

    function buildImageLinks(q, onChange) {
      var wrap = el("div");
      var MAX = 5;
      var list = [];
      var listEl = el("div", { class: "img-list" });

      function emit() { onChange(list.filter(function (v) { return v; })); }

      function addRow(val) {
        if (list.length >= MAX) return;
        var row = el("div", { class: "img-row" });
        var inp = el("input", { type: "url", placeholder: "Image link (" + (list.length + 1) + "/" + MAX + ")…", value: val || "" });
        var rm = el("button", { class: "remove", text: "×", "aria-label": "Remove this image link" });
        row.appendChild(inp); row.appendChild(rm);
        listEl.appendChild(row);
        list.push("");
        var idx = list.length - 1;
        inp.oninput = function () { list[idx] = inp.value.trim(); emit(); };
        rm.onclick = function () {
          listEl.removeChild(row);
          list.splice(idx, 1);
          emit();
          // re-number placeholders
          Array.prototype.forEach.call(listEl.children, function (r, i) {
            r.querySelector("input").placeholder = "Image link (" + (i + 1) + "/" + MAX + ")…";
          });
        };
      }

      addRow("");
      wrap.appendChild(listEl);
      var add = el("button", { class: "add-link", text: "+ Add another link" });
      add.onclick = function () { if (list.length < MAX) { addRow(""); setTimeout(function () { var last = listEl.lastChild && listEl.lastChild.querySelector("input"); if (last) last.focus(); }, 30); } };
      wrap.appendChild(add);
      return wrap;
    }

    /* ---- render a question ---- */
    function render() {
      var q = QUESTIONS[currentIndex];
      if (!q) return renderReview();
      clear();
      var prog = renderProgress();
      prog.forEach(function (p) { stage.appendChild(p); });

      var promptHtml = q.prompt || "";
      stage.appendChild(el("h1", { class: "prompt", html: promptHtml }));
      if (q.help) stage.appendChild(el("p", { class: "help", html: q.help }));

      var value = null; /* resolved value passed to next() */
      var fieldWrap = el("div");

      if (q.kind === "enum") {
        var g = buildChoice(q, function (v) { value = v; next.disabled = false; });
        fieldWrap.appendChild(g);
      } else if (q.kind === "boolean") {
        var g2 = buildBoolean(q, function (v) { value = v; next.disabled = false; });
        fieldWrap.appendChild(g2);
      } else if (q.kind === "logo") {
        var lw = buildLogo(q, function (s) {
          value = s;
          /* a logo answer always satisfies the question */
          next.disabled = false;
        });
        fieldWrap.appendChild(lw);
      } else if (q.kind === "image_links") {
        var iw = buildImageLinks(q, function (arr) { value = arr; });
        fieldWrap.appendChild(iw);
      } else {
        fieldWrap.appendChild(el("label", { class: "field-label", text: q.label || "Answer" }));
        if (q.kind === "integer") {
          var num = el("input", { type: "number", step: "1", "aria-label": q.label || q.prompt, placeholder: q.placeholder || "" });
          num.oninput = function () { value = num.value.trim(); next.disabled = q.required !== false && !value; };
          fieldWrap.appendChild(num);
        } else {
          var ta = el("textarea", { "aria-label": q.label || q.prompt, placeholder: q.placeholder || "Type your answer…" });
          ta.oninput = function () { value = ta.value.trim(); next.disabled = q.required !== false && !value; };
          fieldWrap.appendChild(ta);
        }
      }
      stage.appendChild(fieldWrap);

      var msg = el("div", { class: "msg", role: "alert", "aria-live": "polite" });
      var last = currentIndex === TOTAL - 1;
      var next = el("button", { class: "primary", "aria-keyshortcuts": "Enter", html: (last ? "Submit my brief" : "Continue") + ' <span class="arrow">&#8594;</span>' });
      next.disabled = q.required === true;
      currentMsg = msg;
      currentNext = next;
      var row = el("div", { class: "row" });
      row.appendChild(next);
      if (q.required === false) {
        var skip = el("button", { class: "ghost", text: "Skip" });
        skip.onclick = function () { advance(emptyFor(q), true); };
        row.appendChild(skip);
      }
      stage.appendChild(row);
      stage.appendChild(msg);

      function emptyFor(qq) {
        if (qq.kind === "logo") return { mode: "declined", url: "", file: null, name: "" };
        if (qq.kind === "image_links") return [];
        return qq.default != null ? qq.default : "";
      }

      next.onclick = function () {
        var v = value;
        if ((v === null || v === undefined || v === "") && q.required !== false) { return; }
        advance(v == null ? emptyFor(q) : v, false);
      };

      setTimeout(function () {
        var first = stage.querySelector("textarea, input, [role=radio], .logo-zone");
        if (first) first.focus();
      }, 60);
    }

    function serialize(q, v) {
      /* normalize to the value the bridge + intake_writer.py consume */
      if (q.kind === "logo") {
        if (!v) v = { mode: "declined", url: "", file: null, name: "" };
        if (v.mode === "declined") {
          return { value: "", logo_mode: "declined", note: "no logo on file — building without one" };
        }
        if (v.mode === "file") {
          return { value: "", logo_mode: "file", logo_file_name: v.name, note: "logo uploaded by client (file name captured; binary lives in the run dir when the bridge stores it)" };
        }
        return { value: v.url || "", logo_mode: "link", note: "logo provided by link" };
      }
      if (q.kind === "image_links") {
        return { value: (v || []).join("\n"), image_links: (v || []).filter(function (x) { return x; }) };
      }
      return { value: String(v == null ? "" : v) };
    }

    /* ---- advance / review / submit ---- */
    /* PRES-006: a question with conditional_on is only ever ASKED when its
       condition is met by the answers already given (the declined-reason
       waivers appear only after their yes/no question was answered "no").
       The generated QUESTIONS carry the condition; the flow honors it. */
    function conditionMet(q) {
      var c = q.conditional_on;
      if (!c) return true;
      var a = answers[c.id];
      if (!a) return false;
      return String(a.value == null ? "" : a.value).trim().toLowerCase()
        === String(c.equals).trim().toLowerCase();
    }

    /* In session mode an answer only counts once the worker has accepted
       it (the server enforces order + value shape), so advance() posts
       first and records locally on success. A refusal keeps the client on
       the same question with the server's reason shown. Standalone mode
       records immediately, as before. */
    function advance(v, skipped) {
      var q = QUESTIONS[currentIndex];
      if (SESSION && q) {
        if (submitting) return;
        submitting = true;
        if (currentNext) currentNext.disabled = true;
        if (currentMsg) { currentMsg.className = "msg"; currentMsg.textContent = "Saving…"; }
        postSessionAnswer(q, v).then(function () {
          submitting = false;
          recordAdvance(v, skipped);
        }).catch(function (err) {
          submitting = false;
          if (err && err.status === 401 && SESSION.needsCode) { renderConfirm(err.message); return; }
          if (currentNext) currentNext.disabled = false;
          if (currentMsg) {
            currentMsg.className = "msg err";
            currentMsg.textContent = err && err.message ? err.message : "Saving your answer failed. Please try again.";
          }
        });
        return;
      }
      recordAdvance(v, skipped);
    }

    function recordAdvance(v, skipped) {
      var q = QUESTIONS[currentIndex];
      if (q) {
        var s = serialize(q, v);
        answers[q.id] = {
          raw: v, value: s.value,
          extra: s, kind: q.kind, label: q.label || q.prompt,
          storeOn: q.storeOn, order: q.order,
          skipped: !!skipped
        };
      }
      currentIndex++;
      /* skip conditional questions whose condition is not met — they are not
         asked and carry no answer (never "(skipped)": they were never asked) */
      while (currentIndex < QUESTIONS.length && !conditionMet(QUESTIONS[currentIndex])) {
        currentIndex++;
      }
      if (currentIndex >= QUESTIONS.length) { renderReview(); scrollTop(); }
      else { render(); scrollTop(); }
    }

    function renderReview() {
      clear();
      var prog = renderProgress();
      prog.forEach(function (p) { stage.appendChild(p); });
      stage.appendChild(el("h1", { class: "prompt", html: "That&rsquo;s everything, ready to <span class=\"emph\">send</span>?" }));
      stage.appendChild(el("p", { class: "help", text: SESSION
        ? "Your answers were saved by the interview service as you went. Submit to complete the interview: the service assembles your brief and hands it to the presentation department, and this page then shows the real delivery state."
        : "When you submit, this page sends your answers to the presentation department. If this page cannot deliver them, it will tell you plainly and hand you a backup file instead; a download by itself is not a submission." }));

      var ul = el("ul", { class: "review-list" });
      QUESTIONS.forEach(function (q) {
        var a = answers[q.id];
        if (!a) return;
        var val = a.skipped ? "(skipped)" : (a.kind === "image_links" && a.extra && a.extra.image_links && a.extra.image_links.length ? a.extra.image_links.join("  ·  ") : (a.value || "(none)"));
        if (a.kind === "logo" && a.extra) {
          if (a.extra.logo_mode === "declined") val = "Building without a logo";
          else if (a.extra.logo_mode === "file") val = "Logo file: " + (a.extra.logo_file_name || "uploaded");
          else if (a.extra.value) val = "Logo link: " + a.extra.value;
          else val = "(no logo)";
        }
        ul.appendChild(el("li", {}, [
          el("div", { class: "rq", text: q.label || q.id }),
          el("div", { class: "ra", text: val })
        ]));
      });
      stage.appendChild(ul);

      var msg = el("div", { class: "msg", role: "alert", "aria-live": "polite" });
      var go = el("button", { class: "primary", text: "Submit my brief" });
      go.onclick = function () { go.disabled = true; msg.className = "msg"; msg.textContent = "Submitting…"; submit(msg, go); };
      stage.appendChild(el("div", { class: "row", style: "justify-content:center" }, [go]));
      stage.appendChild(msg);
    }

    /* ---- SUBMIT: store on box + trigger the presentation dept ---- */
    function submit(msg, btn) {
      if (submitting) return;
      submitting = true;

      /* Session mode: the worker assembles the validated intake itself
         from the answers it already holds; the page only completes. */
      if (SESSION) { submitSession(msg, btn); return; }

      var qid = "pres-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
      var payload = buildIntakePayload(qid);

      /* 1) write answers to a JSON intake file (dept format) */
      writeIntakeFile(payload).then(function (w) {
        /* 2) trigger the presentation department start (kanban card, no shortcuts) */
        return triggerDepartment(qid, payload).then(function (t) {
          return { w: w, t: t };
        });
      }).then(function (res) {
        renderDone({ stored: res.w.stored, trigger: res.t.trigger });
      }).catch(function (err) {
        submitting = false;
        msg.className = "msg err";
        msg.textContent = err && err.message ? err.message : "Something went wrong sending your answers — please try again.";
        if (btn) btn.disabled = false;
      });
    }

    function buildIntakePayload(qid) {
      var answersByStore = {};
      var pre = {};
      var brief = {};
      var intake = {};

      QUESTIONS.forEach(function (q) {
        var a = answers[q.id];
        if (!a) return;
        var target = a.storeOn === "intake.json"
          ? ["intake.json", q.key || "json"]
          : (a.storeOn || "").split(".");
        var section = target.length > 1 ? target[0] : "deck_brief";
        var key = target.length > 1 ? target[1] : (q.key || a.storeOn);
        var v = a.value;
        if (a.kind === "image_links") v = a.extra && a.extra.image_links ? a.extra.image_links : [];
        if (a.kind === "logo") {
          if (a.extra.logo_mode === "declined") { brief.LOGO_ON_SLIDES = false; return; }
          if (a.extra.value) brief.LOGO_ON_SLIDES = true;
          else brief.LOGO_ON_SLIDES = false;
        }
        if (section === "pre_presentation_capture") pre[key] = v;
        else if (section === "intake.json") intake[key] = v;
        else brief[key] = v;
      });

      var payload = {
        interview_confirmed: true,
        target_talk_minutes: 20,
        created_at: new Date().toISOString(),
        source: "presentation-interview-app",
        intake_session_id: qid,
        /* PRES-006: schema_version declares the record under contract v2 —
           the canonical field paths below. A legacy reader migrates it
           forward; a current reader validates it directly. */
        schema_version: 2,
        pre_presentation_capture: Object.assign(
          { REPRESENTATION_MIX: "100% of the stated audience", AUDIENCE_COMPOSITION_NOTE: brief.AUDIENCE || "", GROUNDED_CONTENT: brief.OFFER_NAME || "", VISUAL_MIX: "mix", DARK_OK: false, HOOK_SEED: brief.TRANSFORMATION_PROMISE || "" },
          pre
        ),
        deck_brief: brief,
        intake: intake,
        answers: Object.keys(answers).reduce(function (m, id) {
          m[id] = answers[id].value;
          return m;
        }, {})
      };
      /* Item 13: stamp which of the six pre-capture fields were derived
         above (the Object.assign defaults) rather than answered (a real
         answer routed into `pre` carries itself, no provenance entry). */
      var derivedProvenance = {};
      Object.keys(DERIVED_PROVENANCE).forEach(function (k) {
        if (!Object.prototype.hasOwnProperty.call(pre, k)) derivedProvenance[k] = DERIVED_PROVENANCE[k];
      });
      if (Object.keys(derivedProvenance).length) payload.derived_field_provenance = derivedProvenance;
      /* presentation_type is never fabricated (PRES-DEPT-FIX-REVIEW-2026-08-17.md
         Part 6 #3): it is only ever the client's own answer to the
         presentation_type question above. No default, no fallback — if the
         question was somehow never answered, the key is simply absent and the
         box-side intake_writer.py fails closed rather than guessing a deck type. */
      if (answers.presentation_type && answers.presentation_type.value) {
        payload.presentation_type = answers.presentation_type.value;
      }
      return payload;
    }

    /* F10 — a hung sink used to leave the spinner forever: fetch has NO default
       timeout. Every POST now races an abort timer (20 s) and retries twice
       with backoff before surfacing a retryable error message. */
    var FETCH_TIMEOUT_MS = 20000;
    var FETCH_RETRIES = 2;

    function fetchWithTimeout(url, opts, retriesLeft) {
      opts = opts || {};
      retriesLeft = (typeof retriesLeft === "number") ? retriesLeft : FETCH_RETRIES;
      var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, FETCH_TIMEOUT_MS) : null;
      if (ctrl) opts.signal = ctrl.signal;
      return fetch(url, opts).then(function (r) {
        if (timer) clearTimeout(timer);
        return r;
      }).catch(function (err) {
        if (timer) clearTimeout(timer);
        var timedOut = err && (err.name === "AbortError");
        if (timedOut && retriesLeft > 0) {
          return new Promise(function (res) { setTimeout(res, 1500 * (FETCH_RETRIES - retriesLeft + 1)); })
            .then(function () { return fetchWithTimeout(url, opts, retriesLeft - 1); });
        }
        err = err || new Error("network error");
        if (timedOut) err.message = "The server took too long to respond. Please try again.";
        throw err;
      });
    }

    /* write the intake JSON file (client-side download + POST to the box sink) */
    /* A downloaded file is a BACKUP, never a submission (PRES-005
       doctrine): the copy that lands on the client's device is labeled
       submission_status NOT_SUBMITTED inside the record itself, and the
       completion screen says the same in plain words. */
    function downloadBackup(payload, fname) {
      var labeled = Object.assign({}, payload, { submission_status: "NOT_SUBMITTED" });
      download(new Blob([JSON.stringify(labeled, null, 2)], { type: "application/json" }), fname);
    }

    function writeIntakeFile(payload) {
      /* If the app is hosted behind the sink (Worker/Pages with a /api/intake
         endpoint), POST it there. Otherwise fall back to a client-side file
         download so the answers are never lost. */
      var sink = document.body.getAttribute("data-intake-sink") || "";
      var fname = "intake-" + (payload.intake_session_id || "pres") + ".json";
      if (sink) {
        return fetchWithTimeout(sink, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ file_name: fname, intake: payload }) })
          .then(function (r) { if (!r.ok) throw new Error("The box could not store your intake file."); return { stored: "box", fname: fname }; })
          .catch(function (err) { /* fall back to a labeled backup download */ downloadBackup(payload, fname); return { stored: "download", fname: fname }; });
      }
      downloadBackup(payload, fname);
      return Promise.resolve({ stored: "download", fname: fname });
    }

    /* trigger the presentation department (kanban start) */
    function triggerDepartment(qid, payload) {
      var url = document.body.getAttribute("data-dept-trigger") || "";
      if (!url) {
        /* No sink wired: the trigger is logged + the JSON file carries
           intake_session_id, so the box-side intake_bridge.py/cc_board.py
           intake path can pick it up (see repo docs). */
        return Promise.resolve({ trigger: "deferred", note: "box picks up via intake_session_id; no /api/dept-start endpoint wired on this static host" });
      }
      return fetchWithTimeout(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ intake_session_id: qid, intake: payload }) })
        .then(function (r) { if (!r.ok) throw new Error("The presentation department could not be started."); return { trigger: "fired", url: url }; });
    }

    function download(blob, fname) {
      try {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      } catch (e) { /* non-fatal */ }
    }

    function hideIntro() {
      if (app) {
        var intro = app.querySelector(".intro");
        if (intro) intro.style.display = "none";
      }
    }

    /* The completion screen reports what ACTUALLY happened (S2 honesty
       rule): "Submitted" is claimed only when the box sink stored the
       record. A backup download is reported as NOT submitted, in those
       words, with the next step named. */
    function renderDone(outcome) {
      outcome = outcome || {};
      clear();
      var c = el("div", { class: "center" });
      if (outcome.stored === "box") {
        c.appendChild(el("div", { class: "big", role: "heading", "aria-level": "1", text: "Thank you!" }));
        c.appendChild(el("p", { class: "msg ok", text: "✓ Submitted" }));
        c.appendChild(el("p", { class: "thanks", text: outcome.trigger === "fired"
          ? "Your answers are in and the presentation department has been started. You can close this tab."
          : "Your answers are stored on the box. The department start was not triggered from this page, so tell your assistant in chat that your brief is ready to pick up." }));
      } else {
        c.appendChild(el("div", { class: "big", role: "heading", "aria-level": "1", text: "Not submitted yet" }));
        c.appendChild(el("p", { class: "msg err", text: "This page could not deliver your answers, so nothing was submitted." }));
        c.appendChild(el("p", { class: "thanks", text: "Your answers were downloaded to this device as a backup file instead. Send that file to your assistant in chat, or open the interview link your assistant sent you and answer there. A downloaded file on its own does not start your presentation." }));
      }
      c.appendChild(el("p", { class: "thanks", text: "Want another presentation? Just tell your assistant 'new presentation'." }));
      stage.appendChild(c);
      hideIntro();
    }

    /* ---- session mode: the minted-link interview (S2) ----
       The bridge mints a capability link (intake_bridge.py new) and speaks
       it to the client in chat. Opened through that link, this page runs
       the worker's session contract, the same one the session UI uses:
       GET the session, POST each answer (server enforces order + shape),
       POST /complete, then poll the outbox and show the REAL delivery
       state (Saved / Queued / Worker accepted / Action needed). The page
       never mints identity, never sees the admin token, and never POSTs
       /api/intake itself. */
    function apiJson(method, path, body) {
      var opts = { method: method, headers: { "content-type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      return fetchWithTimeout(path, opts).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (res) {
          if (!r.ok) {
            var e = new Error(res.error || ("The interview service answered HTTP " + r.status + "."));
            e.status = r.status;
            throw e;
          }
          return res;
        });
      });
    }

    function postSessionAnswer(q, v) {
      var s = serialize(q, v);
      var body = { question_id: q.id, value: s.value };
      if (SESSION.confirmCode) body.confirm_code = SESSION.confirmCode;
      return apiJson("POST", "/api/sessions/" + SESSION.token + "/answers", body);
    }

    function bootSession(token) {
      SESSION = { token: token, confirmCode: "", needsCode: false };
      apiJson("GET", "/api/sessions/" + token).then(function (res) {
        if (res.status === "complete") { renderSessionDone(); pollOutbox(); return; }
        if (res.status && res.status !== "open") {
          fatal("This interview link is no longer open. Ask your assistant for a fresh link.");
          return;
        }
        if (Array.isArray(res.questions) && res.questions.length) {
          QUESTIONS = res.questions;
          TOTAL = QUESTIONS.length;
        }
        if (res.requires_confirm_code) { SESSION.needsCode = true; renderConfirm(""); return; }
        resumeSession();
      }).catch(function (err) {
        if (err && (err.status === 404 || err.status === 410)) {
          fatal("This interview link has expired or is not valid. Ask your assistant for a fresh link.");
        } else {
          fatal("The interview service could not be reached. Check your connection and reload this page.");
        }
      });
    }

    function resumeSession() {
      apiJson("GET", "/api/sessions/" + SESSION.token + "/answers?since=0").then(function (res) {
        (res.answers || []).forEach(function (row) {
          var q = null;
          QUESTIONS.forEach(function (x) { if (x.id === row.question_id) q = x; });
          if (!q) return;
          answers[q.id] = {
            raw: row.value, value: row.value,
            extra: { value: row.value },
            kind: q.kind, label: q.label || q.prompt,
            storeOn: q.storeOn, order: q.order,
            skipped: row.value === ""
          };
        });
        var prog = res.progress || {};
        if (prog.complete) { currentIndex = QUESTIONS.length; renderReview(); scrollTop(); return; }
        var idx = 0;
        if (prog.current_id) {
          QUESTIONS.forEach(function (x, i) { if (x.id === prog.current_id) idx = i; });
        }
        currentIndex = idx;
        render();
        scrollTop();
      }).catch(function () {
        currentIndex = 0;
        render();
      });
    }

    function renderConfirm(errText) {
      clear();
      stage.appendChild(el("h1", { class: "prompt", html: "One quick <span class=\"emph\">check</span> first" }));
      stage.appendChild(el("p", { class: "help", text: "Your assistant gave you a 6-digit confirmation code in chat. Enter it to open your interview. Your answers are then saved as you go." }));
      stage.appendChild(el("label", { class: "field-label", text: "Confirmation code" }));
      var input = el("input", { type: "text", inputmode: "numeric", autocomplete: "one-time-code", "aria-label": "Confirmation code", placeholder: "6-digit code" });
      stage.appendChild(input);
      var msg = el("div", { class: "msg", role: "alert", "aria-live": "polite" });
      if (errText) { msg.className = "msg err"; msg.textContent = errText; }
      var go = el("button", { class: "primary", text: "Open my interview" });
      go.onclick = function () {
        var code = input.value.trim();
        if (!code) {
          msg.className = "msg err";
          msg.textContent = "Enter the 6-digit code your assistant sent you.";
          return;
        }
        SESSION.confirmCode = code;
        resumeSession();
      };
      input.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); go.click(); } };
      stage.appendChild(el("div", { class: "row" }, [go]));
      stage.appendChild(msg);
      setTimeout(function () { input.focus(); }, 60);
    }

    function submitSession(msg, btn) {
      apiJson("POST", "/api/sessions/" + SESSION.token + "/complete", {}).then(function (res) {
        submitting = false;
        renderSessionDone();
        if (res && res.outbox) setOutboxState(res.outbox.status, res.outbox.job_ref, res.outbox.error);
        pollOutbox();
      }).catch(function (err) {
        submitting = false;
        msg.className = "msg err";
        msg.textContent = err && err.message ? err.message : "Completing your interview failed. Please try again.";
        if (btn) btn.disabled = false;
      });
    }

    function renderSessionDone() {
      clear();
      var c = el("div", { class: "center" });
      c.appendChild(el("div", { class: "big", role: "heading", "aria-level": "1", text: "Thank you!" }));
      c.appendChild(el("p", { class: "thanks", text: "Your interview is complete. Here is exactly where your brief stands:" }));
      c.appendChild(el("p", { class: "msg ok", id: "sessionStatus", text: "✓ Saved: your answers are stored." }));
      c.appendChild(el("p", { class: "thanks", id: "sessionNote", text: "Checking delivery to the presentation department…" }));
      stage.appendChild(c);
      hideIntro();
    }

    function setOutboxState(status, jobRef, errText) {
      var st = document.getElementById("sessionStatus");
      var note = document.getElementById("sessionNote");
      if (!st) return;
      if (status === "worker_accepted") {
        st.className = "msg ok";
        st.textContent = "✓ Worker accepted" + (jobRef ? " (" + jobRef + ")" : "");
        if (note) note.textContent = "The presentation department has your brief and your deck build has started. You can close this tab.";
      } else if (status === "action_needed") {
        st.className = "msg err";
        st.textContent = "Action needed";
        if (note) note.textContent = "Delivery hit a problem" + (errText ? ": " + errText : ".") + " Tell your assistant in chat so they can re-send your brief.";
      } else {
        st.className = "msg ok";
        st.textContent = "✓ Saved and queued";
        if (note) note.textContent = "Your brief is saved and queued for the presentation department. It has not started yet; this page keeps checking, and your assistant can see it in the queue.";
      }
    }

    var outboxTries = 0;
    function pollOutbox() {
      apiJson("GET", "/api/sessions/" + SESSION.token + "/outbox").then(function (res) {
        setOutboxState(res.status, res.job_ref, res.error);
        if (res.status !== "worker_accepted" && res.status !== "action_needed" && outboxTries < 30) {
          outboxTries++;
          setTimeout(pollOutbox, 2500);
        }
      }).catch(function () {
        if (outboxTries < 30) { outboxTries++; setTimeout(pollOutbox, 2500); }
      });
    }

    function fatal(text) {
      clear();
      stage.appendChild(el("div", { class: "center" }));
      stage.appendChild(el("div", { class: "big", role: "heading", "aria-level": "1", text: "Hmm." }));
      stage.appendChild(el("p", { class: "help", text: text }));
    }

    /* ---- keyboard ---- */
    document.addEventListener("keydown", function (e) {
      if (e.altKey && (e.key === "n" || e.key === "N")) {
        var b = stage.querySelector("button.primary:not(:disabled)");
        if (b) { e.preventDefault(); b.click(); }
      }
    });

    if (exitBtn) exitBtn.onclick = function () {
      var note = SESSION
        ? "Leave the interview? The answers you have given are saved; open this same link any time to pick up where you left off."
        : "Leave the interview? Your answers have not been submitted yet and will be lost.";
      if (window.confirm(note)) { window.close(); }
    };

    /* ---- boot ----
       S1 (Item 13): no hardcoded question cap. A fixed cap of 20 used to
       make this page fatal() on its own 21-question contract set at
       boot. The cap is the payload itself: boot validates the embedded
       set structurally (non-empty, ids present and unique, every
       question carries its store target) and derives every count from
       QUESTIONS.length. Opened through a minted capability link, the
       page boots into session mode instead of the standalone flow. */
    function questionSetError() {
      if (!QUESTIONS.length) return "This intake is misconfigured (no questions).";
      var seen = {};
      for (var i = 0; i < QUESTIONS.length; i++) {
        var q = QUESTIONS[i];
        if (!q || !q.id || !q.storeOn) return "This intake is misconfigured (a question is missing its id or store target).";
        if (seen[q.id]) return "This intake is misconfigured (duplicate question: " + q.id + ").";
        seen[q.id] = true;
      }
      return "";
    }

    function sessionTokenFromUrl() {
      var m = /\/s\/([0-9a-f]{32})/i.exec(window.location.pathname || "");
      if (m) return m[1].toLowerCase();
      var t = null;
      try { t = new URLSearchParams(window.location.search || "").get("t"); } catch (e) { t = null; }
      return t && /^[0-9a-f]{32}$/i.test(t) ? t.toLowerCase() : "";
    }

    var bootError = questionSetError();
    if (bootError) fatal(bootError);
    else {
      var linkToken = sessionTokenFromUrl();
      if (linkToken) bootSession(linkToken);
      else render();
    }
  })();
  </script>
</body>
</html>
