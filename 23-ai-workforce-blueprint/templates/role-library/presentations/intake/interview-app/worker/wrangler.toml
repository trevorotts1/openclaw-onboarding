# Presentation Interview app — Cloudflare Worker (API).
#
# Deploy (once):
#   1. Create the D1 database:
#        npx wrangler d1 create presentation_intake
#      Copy the returned database_id into [[d1_databases]] below.
#   2. Apply the schema:
#        npx wrangler d1 execute presentation_intake --remote --file=schema.sql
#   3. Set secrets (see below).
#   4. Deploy:  npx wrangler deploy
#   5. Deploy the UI to Pages (serves everything that is NOT /api/*):
#        npx wrangler pages deploy ../pages --project-name presentation-intake
#      (or enable Workers Static Assets and serve the UI from [assets] directly)
#   6. Verify:  curl https://<host>/healthz

name               = "presentation-interview"
main               = "src/index.js"
compatibility_date = "2024-09-23"
account_id         = "<PLACEHOLDER_CF_ACCOUNT_ID>"

# Route the API under /api/* on the intake host. The Pages project serves the
# UI for every other path (/s/<token>, /). Fill in the operator's zone.
routes = [
  { pattern = "presentation-interview.<PLACEHOLDER_FLEET_DOMAIN>/api/*", zone_name = "<PLACEHOLDER_FLEET_DOMAIN>" }
]

# D1 binding. Fill database_id from `wrangler d1 create presentation_intake`.
[[d1_databases]]
binding       = "DB"
database_name = "presentation_intake"
database_id   = "<PLACEHOLDER_D1_DATABASE_ID>"

[observability]
enabled = true

# Secrets (NEVER in this file — set via `wrangler secret put`):
#   INTAKE_ADMIN_TOKEN     -- box→worker bearer for POST /api/sessions,
#                            /api/intake and /api/dept-start. Same value lives
#                            on the box as env INTAKE_ADMIN_TOKEN.
#   COMMAND_CENTER_URL     -- the Command Center board base URL (used by
#                            /api/dept-start to POST /api/tasks/ingest).
#   CC_DEPT_START_TOKEN    -- bearer the CC board expects for ingest (optional;
#                            falls back to INTAKE_ADMIN_TOKEN).
