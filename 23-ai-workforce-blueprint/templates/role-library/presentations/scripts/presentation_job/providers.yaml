# providers.yaml -- per-provider governor config. [FIX 14]
# Shape per provider: {rps, burst, max_inflight, daily_cap, poll_counts_toward_rps}
#   rps                     sustained acquisitions per second (token refill)
#   burst                   token-bucket capacity == max allowed in any
#                           rolling 10 s window at full rate
#   max_inflight            concurrent acquisitions ceiling
#   daily_cap               acquisitions per UTC day; 0 = unlimited
#   poll_counts_toward_rps  false lets poll GETs bypass the rate bucket
#   ramp_floor / ramp_rps   optional: initial (cautious) values for providers
#                           with an unpublished, tier-based cap; a first
#                           report_429 halves the rate and the governor
#                           recovers on report_ok -- the ramp behaviour the
#                           Part 7 "start N-M, ramp on 429" rows ask for
# Values below are the verified Part 7 ceilings [R12]; the governor reads the
# resource profile for plan tier overrides (ollama 3/10 by plan) and merges
# them over these defaults. Unknown providers and any provider missing here
# fall back to `defaults`.

defaults:
  rps: 1.0
  burst: 10
  max_inflight: 50
  daily_cap: 0
  poll_counts_toward_rps: true

kie:
  # Part 7: 20 new tasks per 10 s -> 2 submits/s; ~100+ running -> 100 in
  # flight; poll GETs counted in the same window; 429 dropped not queued.
  rps: 2.0
  burst: 20
  max_inflight: 100
  daily_cap: 5000
  # polls count toward the rate bucket (Part 7: poll GETs counted in the
  # same 10 s window as submits)
  poll_counts_toward_rps: true

deepseek:
  # Part 7: DeepSeek direct, account-wide concurrency: Pro 500, Flash 2500.
  # rps is the acquisition limiter: the pro tier supports 400 text units and
  # flash 2000; the per-model split lives in model_catalog/route stamps, the
  # governor holds the shared account bucket at the pro-safe number and the
  # dispatcher's own per-model caps stay under it.
  rps: 5.0
  burst: 20
  max_inflight: 400
  daily_cap: 0
  poll_counts_toward_rps: true

openai:
  rps: 1.0
  burst: 10
  max_inflight: 50
  daily_cap: 0
  poll_counts_toward_rps: true

openrouter:
  # OPERATOR CEILING, 2026-09-07: "if I am using OpenRouter I should not be
  # capped at 8. I should be able to use at least 100 agents in parallel if
  # I'm using OpenRouter."  The governor must therefore never be the thing
  # that admits fewer than 100 concurrent calls on this provider.  100 is the
  # operator's DECLARED ALLOCATION and it matches model_router's ultra mode
  # ceiling, so `min(mode ceiling 100, governor max_inflight 100)` = 100.
  #
  # WHAT THE OLD 20/50 WAS.  OpenRouter's paid concurrency and RPS caps are
  # UNPUBLISHED -- Part 7 states only the free-tier 20 RPM and the DDoS
  # protection -- so the previous
  # `rps 2.0 / burst 20 / max_inflight 50` was OUR OWN opening bid
  # ("start 20-50, ramp on 429"), not a measurement of OpenRouter.  It has
  # never been ramped: the row has one commit in its whole history and no run
  # on this box has ever exercised OpenRouter at any concurrency.  Replacing
  # an unmeasured guess with an operator-declared number is not a widening of
  # a known limit; it is the operator supplying the capacity fact the build
  # could not establish for itself.
  #
  # WHY burst 100 / rps 10.0.  The governor enforces a hard rolling-10s
  # ceiling of `burst` admissions (governor.acquire, the window_cap branch).
  # At burst 20 a 100-unit fan-out needs ~50 s just to be ADMITTED, so the
  # in-flight ceiling alone would not deliver 100 parallel in any useful
  # sense.  burst 100 admits the whole wave inside one window; rps 10.0
  # refills that bucket in 10 s so steady-state churn keeps up.
  #
  # WHAT THE RAMP DOES AND DOES NOT COVER -- read before trusting the 100.
  # The ramp is real and wired: governor.report_429 halves the refill rate
  # AND the 10 s window ceiling for 60 s (floor 1/32, re-halving on repeat
  # 429s) and governor.report_ok doubles it back toward 1.0; the OpenRouter
  # transport feeds both (dispatcher._openai_compat_complete -> _govern_ok on
  # a clean response, _govern_429 on HTTP 429).  BUT the ramp scales the RATE
  # axis ONLY -- `max_inflight` is not reduced by a 429.  So a 429 storm
  # slows how fast new calls START; it does not pull the 100 concurrent
  # sockets back down.  100 concurrent is an operator-declared bet, not a
  # proven-safe number, and the first ultra run on OpenRouter must be watched
  # for report_429 rows in the governor ledger.
  rps: 10.0
  burst: 100
  max_inflight: 100
  daily_cap: 0
  poll_counts_toward_rps: true

anthropic:
  rps: 1.0
  burst: 10
  max_inflight: 50
  daily_cap: 0
  poll_counts_toward_rps: true

ollama:
  # Part 7: Pro 3, Max 10 -- over-cap queues, no session or weekly limits
  # since 2026-08-31. The YAML default keeps the free-floor 3; the resource
  # profile plan tier ($20/month -> 3, $100/month -> 8 via PLAN_TIER_RPS --
  # 8, not the seat's raw 10: operator ruling 2026-09-04, "i said 8 so that 2
  # are left over for other work") overrides rps and max_inflight when present.
  rps: 3.0
  burst: 10
  max_inflight: 3
  daily_cap: 0
  poll_counts_toward_rps: true

gemini:
  rps: 1.0
  burst: 10
  max_inflight: 25
  daily_cap: 0
  poll_counts_toward_rps: true

elevenlabs:
  rps: 0.5
  burst: 5
  max_inflight: 10
  daily_cap: 0
  poll_counts_toward_rps: true

fish:
  rps: 1.0
  burst: 10
  max_inflight: 20
  daily_cap: 0
  poll_counts_toward_rps: true

ghl:
  rps: 2.0
  burst: 20
  max_inflight: 25
  daily_cap: 0
  poll_counts_toward_rps: true

agnes:
  # Part 7: Starter 1500 req/5 h ~ 0.083 req/s sustained; text 1000 RPM;
  # image 100 RPM at 1K, 80 at 2K. Quota-based, no published concurrency.
  # ~5 sustained text units (Starter) / ~25 (Plus) -> rps kept conservative,
  # in-flight capped at the Plus sustained row; daily_cap 4000 images.
  rps: 0.5
  burst: 10
  max_inflight: 25
  daily_cap: 4000
  poll_counts_toward_rps: true

zai:
  # Part 7: Z.ai direct (GLM 5.3 Flash) -- unpublished, tier-based:
  # "start 5-10, ramp on 429". Conservative floor with ramp semantics
  # (report_429 halves; report_ok recovers). 1M context, 128K output.
  rps: 0.5
  burst: 10
  max_inflight: 10
  daily_cap: 0
  poll_counts_toward_rps: true

# Part 7 rate-limit derivations (verified [R12]):
#   kie          20 new tasks / 10 s = 2 rps; window cap = burst 20; ~100+ running -> max_inflight 100
#   deepseek     Pro 500 / Flash 2500 account-wide concurrent; text units Pro 400, Flash 2000 -> shared bucket max_inflight 400
#   openrouter   free 20 RPM, paid cap UNPUBLISHED -> no measurable ceiling exists;
#                the 20/50 was our own unmeasured opening bid. Operator ruling
#                2026-09-07 declares the allocation: window 100, inflight 100.
#   ollama       Pro 3 / Max 10 by plan (profile tier overrides rps + max_inflight)
#   agnes        ~5 sustained Starter / ~25 Plus; image 80/min at 2K; 4000 images/day
#   zai          unpublished tier-based -> start 5-10 ramp on 429
