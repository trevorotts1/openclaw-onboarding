<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undeclared effects scene</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
           font-family: sans-serif; }
  .dot { position: absolute; width: 60px; height: 60px; border-radius: 30px; background: #e76f51; }
</style>
</head>
<body>
<div id="stage">
  <div class="dot" id="dot0"></div>
  <div class="dot" id="dot1"></div>
  <div class="dot" id="dot2"></div>
  <div class="dot" id="dot3"></div>
  <div class="dot" id="dot4"></div>
  <div class="dot" id="dot5"></div>
</div>
<script>
window.__sceneDuration = 5;
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function spring(p) { return 1 - Math.cos(p * 9) * Math.exp(-p * 4); }
window.__setTime = function (t) {
  for (var i = 0; i < 6; i++) {
    var el = document.getElementById("dot" + i);
    var left = 140 + ((i * 613) % 1500);
    var top = 120 + ((i * 389) % 780);
    var p = clamp01((t - i * 0.3) / 2);
    el.style.left = left + "px";
    el.style.top = top + "px";
    el.style.transform = "scale(" + Math.max(0.05, spring(p)) + ")";
  }
};
window.__setTime(0);
</script>
</body>
</html>
