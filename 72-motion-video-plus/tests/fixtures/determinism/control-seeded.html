<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MG-026 determinism fixture: seeded control scene</title>
<style>
  html, body { margin: 0; padding: 0; background: #F7F4EE; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
           background: #F7F4EE; font-family: sans-serif; color: #192A38; }
  #headline { position: absolute; left: 120px; top: 90px; font-size: 96px; font-weight: 700; }
  #bar { position: absolute; left: 420px; top: 520px; height: 90px; background: #C04A26; }
  .dot { position: absolute; width: 26px; height: 26px; border-radius: 13px; background: #192A38; }
</style>
</head>
<body>
<div id="stage">
  <div id="headline">Seeded control scene</div>
  <div id="bar"></div>
  <div id="dots"></div>
</div>
<script>
  // MG-026 verifier fixture: the CONTROL scene. This scene obeys the
  // animation contract: __setTime(t) is a pure function of t. The bar
  // width is arithmetic on t, and the dot scatter is drawn from a
  // seeded generator whose seed is the frame number alone, so seeking
  // to the same time always produces the same pixels no matter what
  // was rendered before or how long the wall clock ran. The verifier
  // must find this scene identical under cold, history, and delayed
  // captures. Fixture only: never ship as production scene code.
  window.__sceneDuration = 6;
  function mulberry32(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const bar = document.getElementById("bar");
  const dots = document.getElementById("dots");
  window.__setTime = function (t) {
    const progress = Math.min(Math.max(t / 3, 0), 1);
    bar.style.width = Math.round(progress * 1200) + "px";
    const frame = Math.round(t * 30);
    const rand = mulberry32(1000 + frame);
    dots.innerHTML = "";
    for (let i = 0; i < 24; i += 1) {
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (120 + Math.floor(rand() * 1600)) + "px";
      d.style.top = (700 + Math.floor(rand() * 280)) + "px";
      dots.appendChild(d);
    }
  };
  window.__setTime(0);
</script>
</body>
</html>
